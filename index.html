<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HRM - Master Import</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; background: #fafafa; color: #111; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 14px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
    .btn { border: 1px solid #111; background: #111; color: white; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
    .btn.secondary { background: white; color: #111; border-color: #e5e7eb; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .input, select { border: 1px solid #e5e7eb; padding: 10px 12px; border-radius: 10px; width: 100%; }
    .label { font-size: 12px; color: #374151; margin: 8px 0 6px; }
    .table-wrap { overflow:auto; border: 1px solid #eee; border-radius: 12px; }
    .table { width: 100%; border-collapse: collapse; min-width: 880px; }
    .table th, .table td { text-align: left; border-bottom: 1px solid #eee; padding: 10px 8px; font-size: 14px; white-space: nowrap; }
    .badge { display: inline-block; padding: 2px 8px; border: 1px solid #e5e7eb; border-radius: 999px; font-size: 12px; }
    .warn { border-color: #f59e0b; }
    .danger { border-color: #ef4444; }
    .muted { color: #6b7280; }
    .nav { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .nav a, .nav button { padding: 8px 10px; border-radius: 10px; border: 1px solid #e5e7eb; background: white; }
    .nav button { cursor: pointer; }
    h1,h2,h3 { margin: 0 0 8px 0; }
    p { margin: 6px 0; }
    .small { font-size: 12px; }
    .pill { padding: 8px 10px; border-radius: 999px; border: 1px solid #e5e7eb; background: white; }
    code { background:#f3f4f6; padding:2px 6px; border-radius:6px; }
  </style>
  <!-- SheetJS for parsing XLSX (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container" id="app"></div>

  <script>
  (function(){
    const app = document.getElementById("app");

    const STORE_KEY = "hrm_master_import_v4";

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

    function loadStore(){
      try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : { rows: [], importedAt: null }; }
      catch { return { rows: [], importedAt: null }; }
    }
    function saveStore(store){ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }

    function resetData(){
      localStorage.removeItem(STORE_KEY);
      render();
    }

    function excelDateToJS(v){
      // Accept Date, Excel serial number, or parseable string
      if (!v && v !== 0) return null;

      if (v instanceof Date && !isNaN(v)) return v;

      if (typeof v === "number" && isFinite(v)) {
        // Excel serial date (1900 system)
        const utc = Math.round((v - 25569) * 86400 * 1000);
        const d = new Date(utc);
        return isNaN(d) ? null : d;
      }

      if (typeof v === "string") {
        const s = v.trim();
        if (!s) return null;
        const d = new Date(s);
        if (!isNaN(d)) return d;

        // Try dd/mm/yyyy
        const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
        if (m){
          const dd = Number(m[1]), mm = Number(m[2]) - 1, yy = Number(m[3].length === 2 ? ("20"+m[3]) : m[3]);
          const d2 = new Date(yy, mm, dd);
          return isNaN(d2) ? null : d2;
        }
      }
      return null;
    }

    function fmtDate(d){
      if (!d) return "—";
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const da = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${da}`;
    }

    function addMonths(date, months){
      const d = new Date(date.getTime());
      const day = d.getDate();
      d.setMonth(d.getMonth() + months);
      // handle month roll
      if (d.getDate() < day) d.setDate(0);
      return d;
    }

    function daysLeft(d){
      if (!d) return null;
      const a = new Date(); a.setHours(0,0,0,0);
      const b = new Date(d.getTime()); b.setHours(0,0,0,0);
      return Math.round((b - a) / (24*3600*1000));
    }

    function normalizeHeader(h){
      return String(h ?? "").trim();
    }

    function findHeaderRow(rows){
      // Find first row that contains FULL NAME and PASSPORT
      for (let i = 0; i < rows.length; i++){
        const row = rows[i].map(normalizeHeader);
        const hasFull = row.includes("FULL NAME");
        const hasPass = row.includes("PASSPORT");
        const hasVal = row.includes("PASSPORT VALIDITY");
        if (hasFull && hasPass && hasVal) return i;
      }
      return -1;
    }

    function mapIndexes(headers){
      const idx = {};
      const need = [
        "FULL NAME",
        "Chức danh đi biển Dự án (TA) theo KHC",
        "DAWINCI",
        "PASSPORT",
        "PASSPORT VALIDITY",
        "PROJECT CODE" // optional for future
      ];
      for (const key of need){
        idx[key] = headers.indexOf(key);
      }
      return idx;
    }

    async function importMasterFile(file){
      if (!window.XLSX) throw new Error("Không tải được thư viện XLSX (CDN). Hãy thử lại hoặc đổi mạng.");

      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });

      const sheetName = wb.SheetNames.find(n => n === "Master File") || "Master File";
      const ws = wb.Sheets[sheetName];
      if (!ws) throw new Error(`Không tìm thấy sheet "Master File". Sheet đang có: ${wb.SheetNames.join(", ")}`);

      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true });
      const headerRow = findHeaderRow(rows);
      if (headerRow < 0) throw new Error('Không tìm thấy dòng header có "FULL NAME / PASSPORT / PASSPORT VALIDITY".');

      const headers = rows[headerRow].map(normalizeHeader);
      const idx = mapIndexes(headers);

      // Validate required columns
      const required = [
        "FULL NAME",
        "Chức danh đi biển Dự án (TA) theo KHC",
        "DAWINCI",
        "PASSPORT",
        "PASSPORT VALIDITY"
      ];
      const missing = required.filter(k => idx[k] === -1);
      if (missing.length){
        throw new Error("Thiếu cột: " + missing.join(", "));
      }

      const out = [];
      for (let r = headerRow + 1; r < rows.length; r++){
        const row = rows[r];
        const fullName = String(row[idx["FULL NAME"]] ?? "").trim();
        if (!fullName) continue;

        const titleTA = String(row[idx["Chức danh đi biển Dự án (TA) theo KHC"]] ?? "").trim() || null;
        const dawinci = String(row[idx["DAWINCI"]] ?? "").trim() || null;
        const passport = String(row[idx["PASSPORT"]] ?? "").trim() || null;

        const rawValidity = row[idx["PASSPORT VALIDITY"]];
        const validity = excelDateToJS(rawValidity);

        const projectCodeIdx = idx["PROJECT CODE"];
        const projectCode = projectCodeIdx >= 0 ? (String(row[projectCodeIdx] ?? "").trim() || null) : null;

        out.push({
          fullName,
          titleTA,
          dawinci,
          passport,
          passportValidity: validity ? validity.toISOString() : null,
          projectCode
        });
      }

      // Sort by passport validity (nulls last)
      out.sort((a,b)=>{
        const da = a.passportValidity ? Date.parse(a.passportValidity) : Infinity;
        const db = b.passportValidity ? Date.parse(b.passportValidity) : Infinity;
        return da - db;
      });

      const store = { rows: out, importedAt: new Date().toISOString() };
      saveStore(store);
      render();
    }

    function render(){
      const store = loadStore();
      const rows = store.rows || [];
      const importedAt = store.importedAt ? new Date(store.importedAt) : null;

      const today = new Date();
      const warnUntil = addMonths(today, 6);

      const stats = (() => {
        let warn = 0, expired = 0, nodate = 0;
        for (const r of rows){
          if (!r.passportValidity){ nodate++; continue; }
          const d = new Date(r.passportValidity);
          if (isNaN(d)) { nodate++; continue; }
          if (d < today) expired++;
          else if (d <= warnUntil) warn++;
        }
        return { total: rows.length, warn, expired, nodate };
      })();

      app.innerHTML = `
        <div class="nav">
          <a href="#" class="pill"><b>HRM Master Import</b></a>
          <span class="badge">Warning window: 6 months</span>
          <button id="btnReset" class="btn secondary">Reset data</button>
        </div>

        <div class="card">
          <h2>Import từ Excel (sheet: <code>Master File</code>)</h2>
          <p class="muted">Chỉ lấy các cột: <b>FULL NAME</b>, <b>Chức danh đi biển Dự án (TA) theo KHC</b>, <b>DAWINCI</b>, <b>PASSPORT</b>, <b>PASSPORT VALIDITY</b>. Nếu <b>PASSPORT VALIDITY</b> còn ≤ 6 tháng sẽ cảnh báo.</p>

          <div class="row" style="margin-top:10px">
            <div style="flex: 1 1 360px">
              <div class="label">Chọn file Excel (.xlsx)</div>
              <input id="file" class="input" type="file" accept=".xlsx,.xls" />
            </div>
            <div style="flex: 0 0 auto">
              <button id="btnImport" class="btn" disabled>Import</button>
            </div>
          </div>

          <div style="margin-top:12px" class="row">
            <span class="badge">Total: ${stats.total}</span>
            <span class="badge warn">Expiring ≤6M: ${stats.warn}</span>
            <span class="badge danger">Expired: ${stats.expired}</span>
            <span class="badge">No date: ${stats.nodate}</span>
            <span class="muted small">${importedAt ? ("Imported at: " + importedAt.toLocaleString()) : "Chưa import file"}</span>
          </div>
        </div>

        <div class="spacer"></div>

        <div class="card">
          <div class="row" style="align-items:center; justify-content:space-between">
            <div>
              <h2>Danh sách nhân sự</h2>
              <p class="muted small">Tip: dùng ô search để tìm theo tên / passport / chức danh / dawinci.</p>
            </div>
            <div style="min-width:320px; flex: 1 1 320px">
              <div class="label">Search</div>
              <input id="q" class="input" placeholder="Nhập từ khoá..." />
            </div>
          </div>

          <div class="spacer"></div>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>FULL NAME</th>
                  <th>Chức danh (TA) theo KHC</th>
                  <th>DAWINCI</th>
                  <th>PASSPORT</th>
                  <th>PASSPORT VALIDITY</th>
                  <th>Cảnh báo</th>
                </tr>
              </thead>
              <tbody id="tbody">
                ${rows.length ? "" : `<tr><td colspan="6" class="muted">Chưa có dữ liệu. Hãy import file Excel.</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      `;

      document.getElementById("btnReset").addEventListener("click", resetData);

      const fileEl = document.getElementById("file");
      const btnImport = document.getElementById("btnImport");
      fileEl.addEventListener("change", () => {
        btnImport.disabled = !(fileEl.files && fileEl.files.length);
      });
      btnImport.addEventListener("click", async () => {
        const f = fileEl.files && fileEl.files[0];
        if (!f) return;
        btnImport.disabled = true;
        btnImport.textContent = "Importing...";
        try {
          await importMasterFile(f);
        } catch (e) {
          alert(String(e && e.message ? e.message : e));
          render();
        } finally {
          btnImport.textContent = "Import";
          btnImport.disabled = false;
        }
      });

      const tbody = document.getElementById("tbody");

      function buildRow(r){
        const validity = r.passportValidity ? new Date(r.passportValidity) : null;
        const dl = validity ? daysLeft(validity) : null;

        let badge = `<span class="badge">—</span>`;
        if (!validity) badge = `<span class="badge">No date</span>`;
        else if (validity < today) badge = `<span class="badge danger">Expired</span>`;
        else if (validity <= warnUntil) badge = `<span class="badge warn">Expiring ≤6M</span>`;

        const daysTxt = (dl === null) ? "" : ` <span class="muted small">(D-${dl})</span>`;

        return `
          <tr>
            <td>${esc(r.fullName)}</td>
            <td>${esc(r.titleTA || "—")}</td>
            <td>${esc(r.dawinci || "—")}</td>
            <td>${esc(r.passport || "—")}</td>
            <td>${esc(fmtDate(validity))}${daysTxt}</td>
            <td>${badge}</td>
          </tr>
        `;
      }

      function renderTable(list){
        if (!list.length){
          tbody.innerHTML = `<tr><td colspan="6" class="muted">No results</td></tr>`;
          return;
        }
        tbody.innerHTML = list.map(buildRow).join("");
      }

      // initial table render
      renderTable(rows);

      // search
      const q = document.getElementById("q");
      q.addEventListener("input", () => {
        const keyword = (q.value || "").toLowerCase().trim();
        if (!keyword) return renderTable(rows);

        const filtered = rows.filter(r => {
          return (
            (r.fullName || "").toLowerCase().includes(keyword) ||
            (r.titleTA || "").toLowerCase().includes(keyword) ||
            (r.dawinci || "").toLowerCase().includes(keyword) ||
            (r.passport || "").toLowerCase().includes(keyword)
          );
        });
        renderTable(filtered);
      });
    }

    // start
    render();
  })();
  </script>
</body>
</html>
