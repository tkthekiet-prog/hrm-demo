<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HRM Demo (V3 UI + Master Import + QE PASS)</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; background: #fafafa; color: #111; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1240px; margin: 0 auto; padding: 20px; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 14px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
    .btn { border: 1px solid #111; background: #111; color: white; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
    .btn.secondary { background: white; color: #111; border-color: #e5e7eb; }
    .btn.danger { background: #fff; color:#b91c1c; border-color:#fecaca; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .input, select { border: 1px solid #e5e7eb; padding: 10px 12px; border-radius: 10px; width: 100%; }
    .label { font-size: 12px; color: #374151; margin: 8px 0 6px; }
    .table-wrap { overflow:auto; border: 1px solid #eee; border-radius: 12px; }
    .table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    .table th, .table td { text-align: left; border-bottom: 1px solid #eee; padding: 10px 8px; font-size: 14px; white-space: nowrap; }
    .badge { display: inline-block; padding: 2px 8px; border: 1px solid #e5e7eb; border-radius: 999px; font-size: 12px; }
    .warn { border-color: #f59e0b; }
    .danger-b { border-color: #ef4444; }
    .ok { border-color: #22c55e; }
    .muted { color: #6b7280; }
    .spacer { height: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .nav { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .nav a, .nav button { padding: 8px 10px; border-radius: 10px; border: 1px solid #e5e7eb; background: white; }
    .nav button { cursor: pointer; }
    h2,h3 { margin: 0 0 8px 0; }
    p { margin: 6px 0; }
    .small { font-size: 12px; }
    code { background:#f3f4f6; padding:2px 6px; border-radius:6px; }
    .kpi { display:flex; gap:10px; flex-wrap: wrap; }
    .kpi .badge { background:#fff; }
    .cell { padding: 0; }
    .cell input, .cell select { width: 100%; border: none; padding: 10px 8px; outline: none; background: transparent; font: inherit; }
    .cell input:focus, .cell select:focus { background: #f9fafb; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container" id="app"></div>

  <script>
  (function(){
    const app = document.getElementById("app");
    const KEYS = {
      projects: "hrm_v6_projects",
      personnel: "hrm_v6_personnel",
      credentials: "hrm_v6_credentials",
      qePass: "hrm_v6_qe_pass"
    };

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    const uuid = () => {
      try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch {}
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = (Math.random()*16)|0, v = c==="x"?r:(r&0x3)|0x8; return v.toString(16);
      });
    };
    const load = (key, fallback) => { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; } };
    const save = (key, value) => localStorage.setItem(key, JSON.stringify(value));

    function ymd(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const da = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${da}`;
    }

    function parseAnyDate(v){
      if (!v && v !== 0) return null;
      if (v instanceof Date && !isNaN(v)) return v;
      if (typeof v === "number" && isFinite(v)) {
        const utc = Math.round((v - 25569) * 86400 * 1000);
        const d = new Date(utc);
        return isNaN(d) ? null : d;
      }
      if (typeof v === "string") {
        const s = v.trim();
        if (!s) return null;
        const d = new Date(s);
        if (!isNaN(d)) return d;
        const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
        if (m){
          const dd = Number(m[1]), mm = Number(m[2]) - 1, yy = Number(m[3].length === 2 ? ("20"+m[3]) : m[3]);
          const d2 = new Date(yy, mm, dd);
          return isNaN(d2) ? null : d2;
        }
      }
      return null;
    }

    function daysLeft(date){
      if (!date) return null;
      const a = new Date(); a.setHours(0,0,0,0);
      const b = new Date(date.getTime()); b.setHours(0,0,0,0);
      return Math.round((b - a) / (24*3600*1000));
    }

    function addDays(date, n){ const d = new Date(date.getTime()); d.setDate(d.getDate() + n); return d; }

    function badgeForExpiry(expiryStr){
      const d = expiryStr ? parseAnyDate(expiryStr) : null;
      if (!d) return { html: `<span class="badge">No date</span>`, d: null, dl: null, level: "nodate" };
      const dl = daysLeft(d);
      if (dl < 0) return { html: `<span class="badge danger-b">Expired</span>`, d, dl, level: "expired" };
      if (dl <= 30) return { html: `<span class="badge danger-b">≤30d</span>`, d, dl, level: "d30" };
      if (dl <= 90) return { html: `<span class="badge warn">≤90d</span>`, d, dl, level: "d90" };
      if (dl <= 180) return { html: `<span class="badge warn">≤180d</span>`, d, dl, level: "d180" };
      return { html: `<span class="badge ok">OK</span>`, d, dl, level: "ok" };
    }

    function ensureSeed(){
      const projects = load(KEYS.projects, []);
      if (projects.length) return;
      const p1 = { id: uuid(), code: "RUYA1", name: "RUYA1 - Demo Project" };
      const p2 = { id: uuid(), code: "LDV",  name: "LDV - Demo Project" };
      save(KEYS.projects, [p1, p2]);
      save(KEYS.personnel, []);
      save(KEYS.credentials, []);
      save(KEYS.qePass, []);
    }

    function resetAll(){
      localStorage.removeItem(KEYS.projects);
      localStorage.removeItem(KEYS.personnel);
      localStorage.removeItem(KEYS.credentials);
      localStorage.removeItem(KEYS.qePass);
      ensureSeed();
      navigate("#/dashboard");
    }

    function getProjects(){ ensureSeed(); return load(KEYS.projects, []); }
    function addProject({code, name}){
      const list = getProjects();
      const p = { id: uuid(), code: (code||"").trim() || null, name: (name||"").trim() };
      save(KEYS.projects, [p, ...list]); return p;
    }

    function getPersonnelAll(){ ensureSeed(); return load(KEYS.personnel, []); }
    function setPersonnelAll(list){ save(KEYS.personnel, list); }
    function getPersonnel(projectId){
      return getPersonnelAll().filter(x => x.project_id === projectId).sort((a,b)=>String(a.full_name||"").localeCompare(String(b.full_name||"")));
    }
    function addPersonnel(row){
      const all = getPersonnelAll();
      const out = { id: uuid(), status: "active", ...row };
      setPersonnelAll([out, ...all]);
      return out;
    }
    function removePersonnelByProject(projectId){
      const all = getPersonnelAll().filter(x => x.project_id !== projectId);
      setPersonnelAll(all);
    }

    function getCredentialsAll(){ ensureSeed(); return load(KEYS.credentials, []); }
    function setCredentialsAll(list){ save(KEYS.credentials, list); }
    function addCredential(row){
      const all = getCredentialsAll();
      const out = { id: uuid(), ...row };
      setCredentialsAll([out, ...all]);
      return out;
    }
    function removeCredentialsByProject(projectId){
      const all = getCredentialsAll().filter(x => x.project_id !== projectId);
      setCredentialsAll(all);
    }
    function getExpiries(projectId, days, kindFilter){
      const until = new Date(); until.setDate(until.getDate() + days);
      const creds = getCredentialsAll().filter(x => x.project_id === projectId);
      const filtered = kindFilter && kindFilter !== "all" ? creds.filter(c => c.kind === kindFilter) : creds;
      const pers = getPersonnel(projectId);
      const pMap = new Map(pers.map(p => [p.id, p]));
      return filtered
        .filter(c => c.expiry_date && new Date(c.expiry_date) <= until)
        .map(c => ({ ...c,
          full_name: (pMap.get(c.personnel_id)?.full_name)||"—",
          passport_no: (pMap.get(c.personnel_id)?.passport_no)||null,
          dawinci: (pMap.get(c.personnel_id)?.dawinci)||null
        }))
        .sort((a,b)=>String(a.expiry_date||"9999-12-31").localeCompare(String(b.expiry_date||"9999-12-31")));
    }

    // QE PASS store
    function getQeAll(){ ensureSeed(); return load(KEYS.qePass, []); }
    function setQeAll(list){ save(KEYS.qePass, list); }
    function getQeByProject(projectId){ return getQeAll().filter(x => x.project_id === projectId); }
    function upsertQe(record, { matchByPassport = true, overwrite = true } = {}){
      const all = getQeAll();
      const norm = (s) => String(s||"").trim().toLowerCase();
      const keyPassport = norm(record.passport_no);
      const keyNo = norm(record.qe_pass_no);
      let idx = -1;
      if (matchByPassport && keyPassport){
        idx = all.findIndex(x => x.project_id === record.project_id && norm(x.passport_no) === keyPassport && (keyNo ? norm(x.qe_pass_no) === keyNo : true));
      }
      if (idx === -1 && keyNo){
        idx = all.findIndex(x => x.project_id === record.project_id && norm(x.qe_pass_no) === keyNo);
      }
      if (idx === -1){
        const out = { id: uuid(), ...record };
        setQeAll([out, ...all]);
        return { action: "insert", row: out };
      } else {
        if (!overwrite) return { action: "skip", row: all[idx] };
        const merged = { ...all[idx], ...record };
        const next = all.slice(); next[idx] = merged;
        setQeAll(next);
        return { action: "update", row: merged };
      }
    }
    function deleteQe(id){ setQeAll(getQeAll().filter(x => x.id !== id)); }
    function removeQeByProject(projectId){ setQeAll(getQeAll().filter(x => x.project_id !== projectId)); }

    // Master import
    function normalizeHeader(h){ return String(h ?? "").trim(); }
    function findHeaderRow(rows){
      for (let i=0;i<rows.length;i++){
        const row = rows[i].map(normalizeHeader);
        if (row.includes("FULL NAME") && row.includes("PASSPORT") && row.includes("PASSPORT VALIDITY")) return i;
      }
      return -1;
    }
    function mapIndexes(headers){
      const idx = {};
      const keys = ["FULL NAME","Chức danh đi biển Dự án (TA) theo KHC","DAWINCI","PASSPORT","PASSPORT VALIDITY"];
      for (const k of keys) idx[k] = headers.indexOf(k);
      return idx;
    }
    async function importFromMasterFileToProject(projectId, file, replaceExisting){
      if (!window.XLSX) throw new Error("Không tải được thư viện XLSX (CDN).");
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });
      const sheetName = wb.SheetNames.find(n => n === "Master File") || "Master File";
      const ws = wb.Sheets[sheetName];
      if (!ws) throw new Error(`Không tìm thấy sheet "Master File". Sheet đang có: ${wb.SheetNames.join(", ")}`);
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true });
      const headerRow = findHeaderRow(rows);
      if (headerRow < 0) throw new Error('Không tìm thấy dòng header có "FULL NAME / PASSPORT / PASSPORT VALIDITY".');
      const headers = rows[headerRow].map(normalizeHeader);
      const idx = mapIndexes(headers);
      const required = ["FULL NAME","Chức danh đi biển Dự án (TA) theo KHC","DAWINCI","PASSPORT","PASSPORT VALIDITY"];
      const missing = required.filter(k => idx[k] === -1);
      if (missing.length) throw new Error("Thiếu cột: " + missing.join(", "));
      if (replaceExisting){
        removePersonnelByProject(projectId);
        removeCredentialsByProject(projectId);
      }
      const existing = getPersonnel(projectId);
      const existsKey = new Set(existing.map(p => `${(p.full_name||"").toLowerCase()}|${(p.passport_no||"").toLowerCase()}`));
      let added = 0, skipped = 0;
      for (let r = headerRow + 1; r < rows.length; r++){
        const row = rows[r];
        const fullName = String(row[idx["FULL NAME"]] ?? "").trim();
        if (!fullName) continue;
        const position = String(row[idx["Chức danh đi biển Dự án (TA) theo KHC"]] ?? "").trim() || null;
        const dawinci = String(row[idx["DAWINCI"]] ?? "").trim() || null;
        const passport = String(row[idx["PASSPORT"]] ?? "").trim() || null;
        const d = parseAnyDate(row[idx["PASSPORT VALIDITY"]]);
        const passportValidity = d ? ymd(d) : null;
        const key = `${fullName.toLowerCase()}|${(passport||"").toLowerCase()}`;
        if (!replaceExisting && existsKey.has(key)){ skipped++; continue; }
        const p = addPersonnel({ project_id: projectId, full_name: fullName, position, dawinci, passport_no: passport, passport_validity: passportValidity, status:"active" });
        if (passportValidity){
          addCredential({ project_id: projectId, personnel_id: p.id, kind:"passport", issue_date:null, expiry_date:passportValidity, notes:"Imported from Master File" });
        }
        added++;
      }
      return { added, skipped };
    }

    // QE import helpers
    function guessHeaderRow(rows){
      for (let i=0;i<Math.min(rows.length, 30); i++){
        const row = rows[i];
        const nonEmpty = row.filter(x => String(x ?? "").trim() !== "").length;
        if (nonEmpty >= 3) return i;
      }
      return 0;
    }
    function uniqueHeaders(headers){
      const seen = new Map();
      return headers.map(h => {
        const base = String(h ?? "").trim() || "COL";
        const key = base.toLowerCase();
        const n = (seen.get(key) || 0) + 1;
        seen.set(key, n);
        return n === 1 ? base : `${base} (${n})`;
      });
    }
    function buildHeaderOptions(headers){
      return [`<option value="">(none)</option>`].concat(headers.map((h, i) => `<option value="${i}">${esc(h)}</option>`)).join("");
    }
    function tryAutoMap(headers){
      const h = headers.map(x => String(x).toLowerCase());
      const find = (patterns) => {
        for (let i=0;i<h.length;i++){
          const cell = h[i];
          if (patterns.some(p => cell.includes(p))) return String(i);
        }
        return "";
      };
      return {
        full_name: find(["full name","name","employee","staff"]),
        passport_no: find(["passport"]),
        dawinci: find(["dawinci","dw"]),
        qe_pass_no: find(["qe pass","qe_pass","pass no","card no","id no","badge"]),
        issue_date: find(["issue","issued"]),
        expiry_date: find(["expiry","expire","valid","validity","valid until"]),
      };
    }
    async function readWorkbook(file){
      if (!window.XLSX) throw new Error("Không tải được thư viện XLSX (CDN).");
      const buf = await file.arrayBuffer();
      return XLSX.read(buf, { type: "array", cellDates: true });
    }
    function sheetToRows(wb, sheetName){
      const ws = wb.Sheets[sheetName];
      return XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true });
    }
    function rowsToMappedRecords(rows, headerRowIdx, map, agent, projectId){
      const out = [];
      for (let r = headerRowIdx + 1; r < rows.length; r++){
        const row = rows[r];
        const get = (k) => {
          const idx = map[k];
          if (idx === "" || idx === null || idx === undefined) return null;
          const i = Number(idx);
          if (!Number.isFinite(i) || i < 0) return null;
          return row[i];
        };
        const fullName = String(get("full_name") ?? "").trim();
        const passport = String(get("passport_no") ?? "").trim();
        const dawinci = String(get("dawinci") ?? "").trim();
        const qeNo = String(get("qe_pass_no") ?? "").trim();
        const issueD = parseAnyDate(get("issue_date"));
        const expiryD = parseAnyDate(get("expiry_date"));
        if (!fullName && !passport && !qeNo && !dawinci && !issueD && !expiryD) continue;
        out.push({
          project_id: projectId,
          full_name: fullName || null,
          passport_no: passport || null,
          dawinci: dawinci || null,
          qe_pass_no: qeNo || null,
          issue_date: issueD ? ymd(issueD) : null,
          expiry_date: expiryD ? ymd(expiryD) : null,
          agent: agent,
          notes: null
        });
      }
      return out;
    }
    async function importQePassWithMapping({projectId, file, agent, sheetName, headerRowIdx, map, overwrite}){
      const wb = await readWorkbook(file);
      const sn = sheetName || wb.SheetNames[0];
      if (!sn) throw new Error("File không có sheet nào.");
      const rows = sheetToRows(wb, sn);
      const hdrIdx = Number(headerRowIdx);
      if (!Number.isFinite(hdrIdx) || hdrIdx < 0 || hdrIdx >= rows.length) throw new Error("Header row không hợp lệ.");
      const records = rowsToMappedRecords(rows, hdrIdx, map, agent, projectId);
      let inserted = 0, updated = 0, skipped = 0;
      for (const rec of records){
        const res = upsertQe(rec, { matchByPassport: true, overwrite: overwrite });
        if (res.action === "insert") inserted++;
        else if (res.action === "update") updated++;
        else skipped++;
      }
      return { inserted, updated, skipped, total: records.length, sheet: sn };
    }

    // Router
    const navigate = (hash) => { location.hash = hash; };
    function parseRoute(){
      const hash = location.hash || "#/dashboard";
      const parts = hash.replace(/^#\//,"").split("/");
      const [page, a, b, c] = parts;
      return { page, a, b, c, hash };
    }
    window.addEventListener("hashchange", route);

    function renderNav(itemsHtml){
      return `
        <div class="nav">
          ${itemsHtml}
          <span class="badge">Mode: Demo (v6)</span>
          <button id="btnReset" class="btn secondary">Reset data</button>
        </div>
      `;
    }
    function bindReset(){
      const btn = document.getElementById("btnReset");
      if (btn) btn.addEventListener("click", resetAll);
    }

    function route(){
      ensureSeed();
      const r = parseRoute();
      if (r.page === "dashboard") return renderDashboard();
      if (r.page === "p" && r.a){
        const projectId = r.a;
        if (!r.b) return renderProjectHome(projectId);
        if (r.b === "personnel"){ return renderPersonnelList(projectId); }
        if (r.b === "expiries") return renderExpiries(projectId);
        if (r.b === "qe-pass") return renderQePassDashboard(projectId);
      }
      navigate("#/dashboard");
    }

    function renderDashboard(){
      const projects = getProjects();
      app.innerHTML = `
        ${renderNav(`<a href="#/dashboard">Dashboard</a>`)}
        <div class="card">
          <h2>Dự án</h2>
          <p class="muted">Vào dự án → Personnel (import Master File) hoặc QE PASS (import GAC/GWC).</p>
          <div class="table-wrap" style="margin-top:10px">
            <table class="table" style="min-width:720px">
              <thead><tr><th>Code</th><th>Tên dự án</th><th></th></tr></thead>
              <tbody>
                ${projects.map(p => `
                  <tr>
                    <td>${esc(p.code||"—")}</td>
                    <td>${esc(p.name)}</td>
                    <td><a class="badge" href="#/p/${p.id}">Open</a></td>
                  </tr>
                `).join("") || `<tr><td colspan="3" class="muted">Chưa có dự án</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
        <div class="spacer"></div>
        <div class="card">
          <h3>Tạo dự án mới</h3>
          <div class="row">
            <div style="flex:1 1 180px"><div class="label">Code</div><input id="code" class="input" placeholder="RUYA1" /></div>
            <div style="flex:2 1 280px"><div class="label">Tên dự án *</div><input id="name" class="input" placeholder="RUYA1 - Rotation Tracking" /></div>
          </div>
          <div class="row" style="margin-top:12px"><button id="btnCreate" class="btn">Create</button></div>
        </div>
      `;
      bindReset();
      document.getElementById("btnCreate").addEventListener("click", () => {
        const code = document.getElementById("code").value;
        const name = document.getElementById("name").value;
        if (!name.trim()) return alert("Tên dự án là bắt buộc");
        addProject({code, name});
        renderDashboard();
      });
    }

    function renderProjectHome(projectId){
      app.innerHTML = `
        ${renderNav(`<a href="#/dashboard">← Dashboard</a> <span class="badge">Project: ${esc(projectId)}</span>`)}
        <div class="grid">
          <div class="card"><h3>Nhân sự</h3><p class="muted">Danh sách nhân sự theo dự án + Import Master File.</p><button id="goPersonnel" class="btn">Open</button></div>
          <div class="card"><h3>Expiry Dashboard</h3><p class="muted">Passport/visa/qe_pass… sắp hết hạn (mặc định 180 ngày).</p><button id="goExpiry" class="btn">Open</button></div>
          <div class="card"><h3>QE PASS Dashboard</h3><p class="muted">Import 2 file từ agent <b>GAC</b> và <b>GWC</b> vào 1 bảng, dễ search và chỉnh sửa.</p><button id="goQe" class="btn">Open</button></div>
        </div>
      `;
      bindReset();
      document.getElementById("goPersonnel").addEventListener("click", ()=>navigate(`#/p/${projectId}/personnel`));
      document.getElementById("goExpiry").addEventListener("click", ()=>navigate(`#/p/${projectId}/expiries`));
      document.getElementById("goQe").addEventListener("click", ()=>navigate(`#/p/${projectId}/qe-pass`));
    }

    function renderPersonnelList(projectId){
      let rows = getPersonnel(projectId);
      const today = new Date();
      const until6m = addDays(today, 180);
      function warnBadge(validityStr){
        const d = validityStr ? parseAnyDate(validityStr) : null;
        if (!d) return `<span class="badge">No date</span>`;
        const dl = daysLeft(d);
        if (dl < 0) return `<span class="badge danger-b">Expired</span>`;
        if (d <= until6m) return `<span class="badge warn">Expiring ≤6M</span>`;
        return `<span class="badge ok">OK</span>`;
      }
      app.innerHTML = `
        ${renderNav(`<a href="#/p/${projectId}">← Project</a> <span class="badge">Personnel</span>`)}
        <div class="card">
          <h2>Import (Master File)</h2>
          <p class="muted">Đọc sheet <code>Master File</code> và lấy 5 cột: <b>FULL NAME</b>, <b>Chức danh đi biển Dự án (TA) theo KHC</b>, <b>DAWINCI</b>, <b>PASSPORT</b>, <b>PASSPORT VALIDITY</b>.</p>
          <div class="row" style="margin-top:10px">
            <div style="flex: 1 1 360px"><div class="label">Chọn file Excel (.xlsx)</div><input id="file" class="input" type="file" accept=".xlsx,.xls" /></div>
            <div style="flex: 0 0 220px"><div class="label">Replace existing (project)</div>
              <select id="replace" class="input"><option value="yes">Yes (đè dữ liệu project này)</option><option value="no" selected>No (skip trùng tên+passport)</option></select>
            </div>
            <div style="flex: 0 0 auto"><button id="btnImport" class="btn" disabled>Import</button></div>
          </div>
          <p id="importResult" class="muted small" style="margin-top:10px"></p>
        </div>
        <div class="spacer"></div>
        <div class="card">
          <h2>Nhân sự</h2>
          <div class="row" style="margin-top:8px"><input id="q" class="input" style="flex:1 1 260px" placeholder="Search name/passport/position/dawinci..." /></div>
          <div class="table-wrap" style="margin-top:10px">
            <table class="table">
              <thead><tr><th>FULL NAME</th><th>PASSPORT</th><th>PASSPORT VALIDITY</th><th>Cảnh báo (≤6M)</th><th>Chức danh (TA) theo KHC</th><th>DAWINCI</th><th>Status</th></tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </div>
      `;
      bindReset();
      const tbody = document.getElementById("tbody");
      const renderTable = (list) => {
        tbody.innerHTML = list.map(r => {
          const d = r.passport_validity ? parseAnyDate(r.passport_validity) : null;
          const dl = d ? daysLeft(d) : null;
          const daysTxt = (dl === null) ? "" : ` <span class="muted small">(D-${dl})</span>`;
          return `
            <tr>
              <td>${esc(r.full_name)}</td>
              <td>${esc(r.passport_no||"—")}</td>
              <td>${esc(r.passport_validity||"—")}${daysTxt}</td>
              <td>${warnBadge(r.passport_validity)}</td>
              <td>${esc(r.position||"—")}</td>
              <td>${esc(r.dawinci||"—")}</td>
              <td>${esc(r.status||"—")}</td>
            </tr>`;
        }).join("") || `<tr><td colspan="7" class="muted">No data</td></tr>`;
      };
      renderTable(rows);
      document.getElementById("q").addEventListener("input", (e) => {
        const q = (e.target.value||"").toLowerCase().trim();
        if (!q) return renderTable(rows);
        renderTable(rows.filter(r =>
          (r.full_name||"").toLowerCase().includes(q) ||
          (r.passport_no||"").toLowerCase().includes(q) ||
          (r.position||"").toLowerCase().includes(q) ||
          (r.dawinci||"").toLowerCase().includes(q)
        ));
      });
      const fileEl = document.getElementById("file");
      const btnImport = document.getElementById("btnImport");
      const replaceEl = document.getElementById("replace");
      const resultEl = document.getElementById("importResult");
      fileEl.addEventListener("change", () => { btnImport.disabled = !(fileEl.files && fileEl.files.length); resultEl.textContent = ""; });
      btnImport.addEventListener("click", async () => {
        const f = fileEl.files && fileEl.files[0];
        if (!f) return;
        btnImport.disabled = true; btnImport.textContent = "Importing..."; resultEl.textContent = "";
        try{
          const replace = replaceEl.value === "yes";
          const res = await importFromMasterFileToProject(projectId, f, replace);
          rows = getPersonnel(projectId); renderTable(rows);
          resultEl.textContent = `Done: added ${res.added}, skipped ${res.skipped}.`;
        } catch (e){
          alert(String(e && e.message ? e.message : e));
        } finally {
          btnImport.textContent = "Import"; btnImport.disabled = false;
        }
      });
    }

    function renderExpiries(projectId){
      const defaultDays = 180;
      const kinds = ["all", "passport", "visa", "qe_pass", "medical", "certificate"];
      app.innerHTML = `
        ${renderNav(`<a href="#/p/${projectId}">← Project</a> <span class="badge">Expiry</span>`)}
        <div class="card">
          <h2>Giấy tờ sắp hết hạn</h2>
          <div class="row" style="margin-top:8px; align-items:center">
            <div style="flex:0 0 auto"><span class="badge">Window (days)</span></div>
            <div style="width:140px"><input id="days" class="input" type="number" min="1" max="3650" value="${defaultDays}" /></div>
            <div style="width:200px"><select id="kindFilter" class="input">${kinds.map(k => `<option value="${k}" ${k==="all"?"selected":""}>${k}</option>`).join("")}</select></div>
            <button id="btnRefresh" class="btn secondary">Refresh</button>
          </div>
          <div class="table-wrap" style="margin-top:10px">
            <table class="table" style="min-width:900px">
              <thead><tr><th>Nhân sự</th><th>Passport</th><th>DAWINCI</th><th>Loại</th><th>Expiry</th><th>D-</th></tr></thead>
              <tbody id="tbody2"></tbody>
            </table>
          </div>
        </div>`;
      bindReset();
      const tbody = document.getElementById("tbody2");
      function renderTable(){
        const d = Number(document.getElementById("days").value || defaultDays);
        const kindFilter = document.getElementById("kindFilter").value || "all";
        const rows = getExpiries(projectId, d, kindFilter);
        tbody.innerHTML = rows.map(r => {
          const dl = r.expiry_date ? daysLeft(parseAnyDate(r.expiry_date)) : null;
          const cls = (dl !== null && dl <= 30) ? "badge danger-b" : (dl !== null && dl <= 90) ? "badge warn" : "badge";
          return `<tr><td>${esc(r.full_name)}</td><td>${esc(r.passport_no||"—")}</td><td>${esc(r.dawinci||"—")}</td><td>${esc(r.kind||"—")}</td><td>${esc(r.expiry_date||"—")}</td><td>${dl===null?"—":`<span class="${cls}">${dl}</span>`}</td></tr>`;
        }).join("") || `<tr><td colspan="6" class="muted">No expiries in window</td></tr>`;
      }
      document.getElementById("btnRefresh").addEventListener("click", renderTable);
      document.getElementById("kindFilter").addEventListener("change", renderTable);
      renderTable();
    }

    function renderQePassDashboard(projectId){
      function calcStats(list){
        let total = list.length, expired = 0, d30 = 0, d90 = 0, d180 = 0, nodate = 0;
        for (const r of list){
          const b = badgeForExpiry(r.expiry_date);
          if (b.level === "nodate") nodate++;
          else if (b.level === "expired") expired++;
          else if (b.level === "d30") d30++;
          else if (b.level === "d90") d90++;
          else if (b.level === "d180") d180++;
        }
        return { total, expired, d30, d90, d180, nodate };
      }

      function mappingWizardHtml(prefix, agent){
        return `
          <div class="card" style="margin-top:12px">
            <h3>Import QE PASS - ${esc(agent)}</h3>
            <p class="muted small">Chọn file → Analyze → map cột → Import. Dữ liệu ${esc(agent)} sẽ merge vào 1 bảng chung.</p>
            <div class="row" style="margin-top:8px">
              <div style="flex: 1 1 360px"><div class="label">Chọn file Excel (.xlsx)</div><input id="${prefix}_file" class="input" type="file" accept=".xlsx,.xls" /></div>
              <div style="flex: 0 0 220px"><div class="label">Overwrite duplicates?</div>
                <select id="${prefix}_overwrite" class="input"><option value="yes" selected>Yes (update nếu trùng passport/QE pass no)</option><option value="no">No (skip nếu trùng)</option></select>
              </div>
              <div style="flex: 0 0 auto"><button id="${prefix}_analyze" class="btn secondary" disabled>Analyze</button></div>
            </div>
            <div id="${prefix}_mapper" style="display:none; margin-top:12px">
              <div class="row">
                <div style="flex: 0 0 240px"><div class="label">Sheet</div><select id="${prefix}_sheet" class="input"></select></div>
                <div style="flex: 0 0 200px"><div class="label">Header row (0-based)</div><input id="${prefix}_hdr" class="input" type="number" min="0" value="0" /></div>
                <div style="flex: 1 1 280px"><div class="label">Auto-map</div><div class="muted small">Tự đoán theo tên cột (bạn có thể chỉnh lại).</div></div>
              </div>
              <div class="row" style="margin-top:10px">
                <div style="flex: 1 1 260px"><div class="label">FULL NAME</div><select id="${prefix}_map_full_name" class="input"></select></div>
                <div style="flex: 1 1 220px"><div class="label">PASSPORT</div><select id="${prefix}_map_passport_no" class="input"></select></div>
                <div style="flex: 1 1 220px"><div class="label">DAWINCI</div><select id="${prefix}_map_dawinci" class="input"></select></div>
                <div style="flex: 1 1 220px"><div class="label">QE PASS NO</div><select id="${prefix}_map_qe_pass_no" class="input"></select></div>
              </div>
              <div class="row" style="margin-top:10px">
                <div style="flex: 1 1 220px"><div class="label">ISSUE DATE</div><select id="${prefix}_map_issue_date" class="input"></select></div>
                <div style="flex: 1 1 220px"><div class="label">EXPIRY DATE</div><select id="${prefix}_map_expiry_date" class="input"></select></div>
                <div style="flex: 0 0 auto"><button id="${prefix}_do_import" class="btn">Import</button></div>
                <div style="flex: 1 1 260px"><div id="${prefix}_msg" class="muted small"></div></div>
              </div>
            </div>
          </div>
        `;
      }

      app.innerHTML = `
        ${renderNav(`<a href="#/p/${projectId}">← Project</a> <span class="badge">QE PASS</span>`)}
        <div class="card">
          <h2>QE PASS Dashboard</h2>
          <p class="muted">Import 2 file từ agent <b>GAC</b> và <b>GWC</b> vào 1 nơi, dễ search và chỉnh sửa (inline).</p>
          <div class="kpi" style="margin-top:10px" id="kpi"></div>
          <div class="row" style="margin-top:10px">
            <div style="flex:1 1 320px"><div class="label">Search</div><input id="q" class="input" placeholder="name / passport / qe pass / dawinci / agent" /></div>
            <div style="flex:0 0 200px"><div class="label">Filter agent</div><select id="agentFilter" class="input"><option value="all" selected>all</option><option value="GAC">GAC</option><option value="GWC">GWC</option></select></div>
            <div style="flex:0 0 auto"><button id="btnAddRow" class="btn secondary">+ Add row</button></div>
            <div style="flex:0 0 auto"><button id="btnClearProject" class="btn danger">Clear QE PASS (project)</button></div>
          </div>
        </div>
        ${mappingWizardHtml("gac", "GAC")}
        ${mappingWizardHtml("gwc", "GWC")}
        <div class="spacer"></div>
        <div class="card">
          <h3>QE PASS Table</h3>
          <div class="table-wrap" style="margin-top:10px">
            <table class="table">
              <thead><tr><th>FULL NAME</th><th>PASSPORT</th><th>DAWINCI</th><th>QE PASS NO</th><th>ISSUE DATE</th><th>EXPIRY DATE</th><th>Agent</th><th>Cảnh báo</th><th>Notes</th><th></th></tr></thead>
              <tbody id="tbodyQe"></tbody>
            </table>
          </div>
          <p class="muted small" style="margin-top:10px">Chỉnh sửa trực tiếp trong bảng (auto-save).</p>
        </div>
      `;

      bindReset();
      const kpiEl = document.getElementById("kpi");
      const tbody = document.getElementById("tbodyQe");
      const qEl = document.getElementById("q");
      const agentFilterEl = document.getElementById("agentFilter");

      function refreshKpi(){
        const s = calcStats(getQeByProject(projectId));
        kpiEl.innerHTML = `
          <span class="badge">Total: ${s.total}</span>
          <span class="badge danger-b">Expired: ${s.expired}</span>
          <span class="badge danger-b">≤30d: ${s.d30}</span>
          <span class="badge warn">≤90d: ${s.d90}</span>
          <span class="badge warn">≤180d: ${s.d180}</span>
          <span class="badge">No date: ${s.nodate}</span>
        `;
      }

      function applyFilters(){
        const kw = (qEl.value||"").toLowerCase().trim();
        const ag = agentFilterEl.value || "all";
        let list = getQeByProject(projectId);
        if (ag !== "all") list = list.filter(x => (x.agent||"") === ag);
        if (kw){
          list = list.filter(x => [x.full_name, x.passport_no, x.dawinci, x.qe_pass_no, x.agent, x.notes].map(v => String(v||"").toLowerCase()).join(" | ").includes(kw));
        }
        list.sort((a,b)=> (a.expiry_date ? Date.parse(a.expiry_date) : Infinity) - (b.expiry_date ? Date.parse(b.expiry_date) : Infinity));
        return list;
      }

      function updateField(id, field, value){
        const all = getQeAll();
        const idx = all.findIndex(x => x.id === id);
        if (idx === -1) return;
        const next = all.slice();
        next[idx] = { ...next[idx], [field]: value };
        setQeAll(next);
      }

      function rowHtml(r){
        const b = badgeForExpiry(r.expiry_date);
        const dlTxt = b.dl === null ? "" : ` <span class="muted small">(D-${b.dl})</span>`;
        return `
          <tr data-id="${esc(r.id)}">
            <td class="cell"><input data-field="full_name" value="${esc(r.full_name||"")}" placeholder="Full name" /></td>
            <td class="cell"><input data-field="passport_no" value="${esc(r.passport_no||"")}" placeholder="Passport" /></td>
            <td class="cell"><input data-field="dawinci" value="${esc(r.dawinci||"")}" placeholder="DAWINCI" /></td>
            <td class="cell"><input data-field="qe_pass_no" value="${esc(r.qe_pass_no||"")}" placeholder="QE Pass No" /></td>
            <td class="cell"><input data-field="issue_date" type="date" value="${esc(r.issue_date||"")}" /></td>
            <td class="cell"><input data-field="expiry_date" type="date" value="${esc(r.expiry_date||"")}" /></td>
            <td class="cell">
              <select data-field="agent">
                <option value="" ${!r.agent?"selected":""}>(none)</option>
                <option value="GAC" ${r.agent==="GAC"?"selected":""}>GAC</option>
                <option value="GWC" ${r.agent==="GWC"?"selected":""}>GWC</option>
              </select>
            </td>
            <td>${b.html}${dlTxt}</td>
            <td class="cell"><input data-field="notes" value="${esc(r.notes||"")}" placeholder="Notes" /></td>
            <td><button class="btn danger" data-action="delete">Delete</button></td>
          </tr>
        `;
      }

      function renderTable(){
        const list = applyFilters();
        refreshKpi();
        tbody.innerHTML = list.map(rowHtml).join("") || `<tr><td colspan="10" class="muted">No data. Import từ GAC/GWC hoặc Add row.</td></tr>`;
        tbody.querySelectorAll("tr[data-id]").forEach(tr => {
          const id = tr.getAttribute("data-id");
          tr.querySelectorAll("input[data-field], select[data-field]").forEach(el => {
            el.addEventListener("change", () => {
              const field = el.getAttribute("data-field");
              const value = el.value || null;
              updateField(id, field, value);
              renderTable();
            });
          });
          const delBtn = tr.querySelector('button[data-action="delete"]');
          if (delBtn){
            delBtn.addEventListener("click", () => {
              if (!confirm("Delete row?")) return;
              deleteQe(id);
              renderTable();
            });
          }
        });
      }

      qEl.addEventListener("input", renderTable);
      agentFilterEl.addEventListener("change", renderTable);

      document.getElementById("btnAddRow").addEventListener("click", () => {
        upsertQe({ project_id: projectId, full_name:"", passport_no:"", dawinci:"", qe_pass_no:"", issue_date:null, expiry_date:null, agent:null, notes:null }, { matchByPassport:false, overwrite:false });
        renderTable();
      });
      document.getElementById("btnClearProject").addEventListener("click", () => {
        if (!confirm("Clear ALL QE PASS rows for this project?")) return;
        removeQeByProject(projectId);
        renderTable();
      });

      function bindWizard(prefix, agent){
        const fileEl = document.getElementById(prefix + "_file");
        const analyzeBtn = document.getElementById(prefix + "_analyze");
        const mapperEl = document.getElementById(prefix + "_mapper");
        const sheetSel = document.getElementById(prefix + "_sheet");
        const hdrEl = document.getElementById(prefix + "_hdr");
        const msgEl = document.getElementById(prefix + "_msg");
        const overwriteEl = document.getElementById(prefix + "_overwrite");
        const doImportBtn = document.getElementById(prefix + "_do_import");
        let wbCache = null;

        fileEl.addEventListener("change", () => {
          analyzeBtn.disabled = !(fileEl.files && fileEl.files.length);
          mapperEl.style.display = "none";
          msgEl.textContent = "";
        });

        analyzeBtn.addEventListener("click", async () => {
          const f = fileEl.files && fileEl.files[0];
          if (!f) return;
          analyzeBtn.disabled = true; analyzeBtn.textContent = "Analyzing..."; msgEl.textContent = "";
          try{
            wbCache = await readWorkbook(f);
            sheetSel.innerHTML = wbCache.SheetNames.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
            sheetSel.value = wbCache.SheetNames[0] || "";
            const rows = sheetToRows(wbCache, sheetSel.value);
            hdrEl.value = String(guessHeaderRow(rows));

            function updateHeaders(){
              const sn = sheetSel.value;
              const rows2 = sheetToRows(wbCache, sn);
              const hdrIdx = Number(hdrEl.value || "0");
              const hdrRow = rows2[hdrIdx] || [];
              const headers = uniqueHeaders(hdrRow.map(normalizeHeader));
              const options = buildHeaderOptions(headers);

              document.getElementById(prefix + "_map_full_name").innerHTML = options;
              document.getElementById(prefix + "_map_passport_no").innerHTML = options;
              document.getElementById(prefix + "_map_dawinci").innerHTML = options;
              document.getElementById(prefix + "_map_qe_pass_no").innerHTML = options;
              document.getElementById(prefix + "_map_issue_date").innerHTML = options;
              document.getElementById(prefix + "_map_expiry_date").innerHTML = options;

              const auto = tryAutoMap(headers);
              document.getElementById(prefix + "_map_full_name").value = auto.full_name;
              document.getElementById(prefix + "_map_passport_no").value = auto.passport_no;
              document.getElementById(prefix + "_map_dawinci").value = auto.dawinci;
              document.getElementById(prefix + "_map_qe_pass_no").value = auto.qe_pass_no;
              document.getElementById(prefix + "_map_issue_date").value = auto.issue_date;
              document.getElementById(prefix + "_map_expiry_date").value = auto.expiry_date;
            }
            sheetSel.addEventListener("change", updateHeaders);
            hdrEl.addEventListener("change", updateHeaders);
            updateHeaders();
            mapperEl.style.display = "block";
          } catch (e){
            alert(String(e && e.message ? e.message : e));
          } finally {
            analyzeBtn.textContent = "Analyze"; analyzeBtn.disabled = false;
          }
        });

        doImportBtn.addEventListener("click", async () => {
          const f = fileEl.files && fileEl.files[0];
          if (!f) return;
          const sn = sheetSel.value;
          const hdrIdx = Number(hdrEl.value || "0");
          const overwrite = overwriteEl.value === "yes";
          const map = {
            full_name: document.getElementById(prefix + "_map_full_name").value,
            passport_no: document.getElementById(prefix + "_map_passport_no").value,
            dawinci: document.getElementById(prefix + "_map_dawinci").value,
            qe_pass_no: document.getElementById(prefix + "_map_qe_pass_no").value,
            issue_date: document.getElementById(prefix + "_map_issue_date").value,
            expiry_date: document.getElementById(prefix + "_map_expiry_date").value,
          };
          doImportBtn.disabled = true; doImportBtn.textContent = "Importing..."; msgEl.textContent = "";
          try{
            const res = await importQePassWithMapping({ projectId, file: f, agent, sheetName: sn, headerRowIdx: hdrIdx, map, overwrite });
            msgEl.textContent = `Imported "${res.sheet}": total ${res.total}, inserted ${res.inserted}, updated ${res.updated}, skipped ${res.skipped}.`;
            renderTable();
          } catch (e){
            alert(String(e && e.message ? e.message : e));
          } finally {
            doImportBtn.textContent = "Import"; doImportBtn.disabled = false;
          }
        });
      }

      bindWizard("gac", "GAC");
      bindWizard("gwc", "GWC");
      renderTable();
    }

    ensureSeed();
    route();
  })();
  </script>
</body>
</html>
