<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HRM Demo (V3 UI + Master Import)</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; background: #fafafa; color: #111; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 14px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn { border: 1px solid #111; background: #111; color: white; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
    .btn.secondary { background: white; color: #111; border-color: #e5e7eb; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .input, select { border: 1px solid #e5e7eb; padding: 10px 12px; border-radius: 10px; width: 100%; }
    .label { font-size: 12px; color: #374151; margin: 8px 0 6px; }
    .table-wrap { overflow:auto; border: 1px solid #eee; border-radius: 12px; }
    .table { width: 100%; border-collapse: collapse; min-width: 980px; }
    .table th, .table td { text-align: left; border-bottom: 1px solid #eee; padding: 10px 8px; font-size: 14px; white-space: nowrap; }
    .badge { display: inline-block; padding: 2px 8px; border: 1px solid #e5e7eb; border-radius: 999px; font-size: 12px; }
    .warn { border-color: #f59e0b; }
    .danger { border-color: #ef4444; }
    .muted { color: #6b7280; }
    .spacer { height: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .nav { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .nav a, .nav button { padding: 8px 10px; border-radius: 10px; border: 1px solid #e5e7eb; background: white; }
    .nav button { cursor: pointer; }
    h2,h3 { margin: 0 0 8px 0; }
    p { margin: 6px 0; }
    .small { font-size: 12px; }
    code { background:#f3f4f6; padding:2px 6px; border-radius:6px; }
  </style>

  <!-- XLSX parser (SheetJS) - used only for Import from Master File -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container" id="app"></div>

  <script>
  (function(){
    const app = document.getElementById("app");

    // ===== Storage keys (v5) =====
    const KEYS = {
      projects: "hrm_v5_projects",
      personnel: "hrm_v5_personnel",
      credentials: "hrm_v5_credentials",
    };

    // ===== Utils =====
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    const uuid = () => {
      try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch {}
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = (Math.random()*16)|0, v = c==="x"?r:(r&0x3)|0x8; return v.toString(16);
      });
    };

    const load = (key, fallback) => {
      try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
      catch { return fallback; }
    };
    const save = (key, value) => localStorage.setItem(key, JSON.stringify(value));

    function ymd(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const da = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${da}`;
    }

    function parseAnyDate(v){
      if (!v && v !== 0) return null;

      if (v instanceof Date && !isNaN(v)) return v;

      if (typeof v === "number" && isFinite(v)) {
        // Excel serial date (1900 system)
        const utc = Math.round((v - 25569) * 86400 * 1000);
        const d = new Date(utc);
        return isNaN(d) ? null : d;
      }

      if (typeof v === "string") {
        const s = v.trim();
        if (!s) return null;

        // Try native parse (ISO / RFC)
        const d = new Date(s);
        if (!isNaN(d)) return d;

        // dd/mm/yyyy or dd-mm-yyyy
        const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
        if (m){
          const dd = Number(m[1]), mm = Number(m[2]) - 1, yy = Number(m[3].length === 2 ? ("20"+m[3]) : m[3]);
          const d2 = new Date(yy, mm, dd);
          return isNaN(d2) ? null : d2;
        }
      }
      return null;
    }

    function fmtDate(d){
      if (!d) return "—";
      return ymd(d);
    }

    function addMonths(date, months){
      const d = new Date(date.getTime());
      const day = d.getDate();
      d.setMonth(d.getMonth() + months);
      if (d.getDate() < day) d.setDate(0);
      return d;
    }

    function daysLeft(date){
      if (!date) return null;
      const a = new Date(); a.setHours(0,0,0,0);
      const b = new Date(date.getTime()); b.setHours(0,0,0,0);
      return Math.round((b - a) / (24*3600*1000));
    }

    function within6Months(date){
      if (!date) return false;
      const today = new Date();
      const until = addMonths(today, 6);
      return date <= until && date >= new Date(today.getFullYear(), today.getMonth(), today.getDate());
    }

    function isExpired(date){
      if (!date) return false;
      const today = new Date(); today.setHours(0,0,0,0);
      const d = new Date(date.getTime()); d.setHours(0,0,0,0);
      return d < today;
    }

    // ===== Seed / Reset =====
    function ensureSeed(){
      const projects = load(KEYS.projects, []);
      if (projects.length) return;

      const p1 = { id: uuid(), code: "RUYA1", name: "RUYA1 - Demo Project" };
      const p2 = { id: uuid(), code: "LDV",  name: "LDV - Demo Project" };

      const today = new Date();
      const p1a = { id: uuid(), project_id: p1.id, full_name: "Tran Van Hieu", position: "Rigger", dawinci: "DW-001", passport_no: "B1234567", passport_validity: ymd(addMonths(today, 5)), status: "active" };
      const p1b = { id: uuid(), project_id: p1.id, full_name: "Thai Binh Minh", position: "Supervisor", dawinci: "DW-002", passport_no: "C7654321", passport_validity: ymd(addMonths(today, 10)), status: "active" };
      const p2a = { id: uuid(), project_id: p2.id, full_name: "Nguyen Van Phuc", position: "Technician", dawinci: "DW-100", passport_no: "A9988776", passport_validity: ymd(addMonths(today, 2)), status: "active" };

      const personnel = [p1a, p1b, p2a];

      const credentials = [
        { id: uuid(), project_id: p1.id, personnel_id: p1a.id, kind: "passport", issue_date: null, expiry_date: p1a.passport_validity, notes: "Seed data" },
        { id: uuid(), project_id: p1.id, personnel_id: p1b.id, kind: "passport", issue_date: null, expiry_date: p1b.passport_validity, notes: "Seed data" },
        { id: uuid(), project_id: p2.id, personnel_id: p2a.id, kind: "passport", issue_date: null, expiry_date: p2a.passport_validity, notes: "Seed data" },
      ];

      save(KEYS.projects, [p1, p2]);
      save(KEYS.personnel, personnel);
      save(KEYS.credentials, credentials);
    }

    function resetAll(){
      localStorage.removeItem(KEYS.projects);
      localStorage.removeItem(KEYS.personnel);
      localStorage.removeItem(KEYS.credentials);
      ensureSeed();
      navigate("#/dashboard");
    }

    // ===== Data access =====
    function getProjects(){ ensureSeed(); return load(KEYS.projects, []); }
    function addProject({code, name}){
      const list = getProjects();
      const p = { id: uuid(), code: (code||"").trim() || null, name: (name||"").trim() };
      save(KEYS.projects, [p, ...list]); return p;
    }

    function getPersonnelAll(){ ensureSeed(); return load(KEYS.personnel, []); }
    function setPersonnelAll(list){ save(KEYS.personnel, list); }
    function getPersonnel(projectId){
      return getPersonnelAll().filter(x => x.project_id === projectId).sort((a,b)=>String(a.full_name||"").localeCompare(String(b.full_name||"")));
    }
    function getPersonnelById(projectId, personnelId){
      return getPersonnel(projectId).find(x => x.id === personnelId) || null;
    }
    function addPersonnel(row){
      const all = getPersonnelAll();
      const out = { id: uuid(), status: "active", ...row };
      setPersonnelAll([out, ...all]);
      return out;
    }
    function removePersonnelByProject(projectId){
      const all = getPersonnelAll().filter(x => x.project_id !== projectId);
      setPersonnelAll(all);
    }

    function getCredentialsAll(){ ensureSeed(); return load(KEYS.credentials, []); }
    function setCredentialsAll(list){ save(KEYS.credentials, list); }

    function getCredentials(projectId, personnelId){
      return getCredentialsAll()
        .filter(x => x.project_id === projectId && x.personnel_id === personnelId)
        .sort((a,b)=>String(a.expiry_date||"9999-12-31").localeCompare(String(b.expiry_date||"9999-12-31")));
    }
    function addCredential(row){
      const all = getCredentialsAll();
      const out = { id: uuid(), ...row };
      setCredentialsAll([out, ...all]);
      return out;
    }
    function removeCredentialsByProject(projectId){
      const all = getCredentialsAll().filter(x => x.project_id !== projectId);
      setCredentialsAll(all);
    }

    function getExpiries(projectId, days, kindFilter){
      const until = new Date(); until.setDate(until.getDate() + days);
      const creds = getCredentialsAll().filter(x => x.project_id === projectId);
      const filtered = kindFilter && kindFilter !== "all" ? creds.filter(c => c.kind === kindFilter) : creds;

      const pers = getPersonnel(projectId);
      const pMap = new Map(pers.map(p => [p.id, p]));

      return filtered
        .filter(c => c.expiry_date && new Date(c.expiry_date) <= until)
        .map(c => ({
          ...c,
          full_name: (pMap.get(c.personnel_id)?.full_name)||"—",
          passport_no: (pMap.get(c.personnel_id)?.passport_no)||null,
          dawinci: (pMap.get(c.personnel_id)?.dawinci)||null
        }))
        .sort((a,b)=>String(a.expiry_date||"9999-12-31").localeCompare(String(b.expiry_date||"9999-12-31")));
    }

    // ===== Excel Import (Master File: pick 5 columns) =====
    function normalizeHeader(h){ return String(h ?? "").trim(); }

    function findHeaderRow(rows){
      for (let i=0;i<rows.length;i++){
        const row = rows[i].map(normalizeHeader);
        if (row.includes("FULL NAME") && row.includes("PASSPORT") && row.includes("PASSPORT VALIDITY")) return i;
      }
      return -1;
    }

    function mapIndexes(headers){
      const idx = {};
      const keys = [
        "FULL NAME",
        "Chức danh đi biển Dự án (TA) theo KHC",
        "DAWINCI",
        "PASSPORT",
        "PASSPORT VALIDITY",
      ];
      for (const k of keys) idx[k] = headers.indexOf(k);
      return idx;
    }

    async function importFromMasterFileToProject(projectId, file, replaceExisting){
      if (!window.XLSX) throw new Error("Không tải được thư viện XLSX (CDN).");
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });

      const sheetName = wb.SheetNames.find(n => n === "Master File") || "Master File";
      const ws = wb.Sheets[sheetName];
      if (!ws) throw new Error(`Không tìm thấy sheet "Master File". Sheet đang có: ${wb.SheetNames.join(", ")}`);

      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true });
      const headerRow = findHeaderRow(rows);
      if (headerRow < 0) throw new Error('Không tìm thấy dòng header có "FULL NAME / PASSPORT / PASSPORT VALIDITY".');

      const headers = rows[headerRow].map(normalizeHeader);
      const idx = mapIndexes(headers);

      const required = [
        "FULL NAME",
        "Chức danh đi biển Dự án (TA) theo KHC",
        "DAWINCI",
        "PASSPORT",
        "PASSPORT VALIDITY",
      ];
      const missing = required.filter(k => idx[k] === -1);
      if (missing.length) throw new Error("Thiếu cột: " + missing.join(", "));

      if (replaceExisting){
        removePersonnelByProject(projectId);
        removeCredentialsByProject(projectId);
      }

      const existing = getPersonnel(projectId);
      const existsKey = new Set(existing.map(p => `${(p.full_name||"").toLowerCase()}|${(p.passport_no||"").toLowerCase()}`));

      let added = 0, skipped = 0;

      for (let r = headerRow + 1; r < rows.length; r++){
        const row = rows[r];
        const fullName = String(row[idx["FULL NAME"]] ?? "").trim();
        if (!fullName) continue;

        const position = String(row[idx["Chức danh đi biển Dự án (TA) theo KHC"]] ?? "").trim() || null;
        const dawinci = String(row[idx["DAWINCI"]] ?? "").trim() || null;
        const passport = String(row[idx["PASSPORT"]] ?? "").trim() || null;

        const d = parseAnyDate(row[idx["PASSPORT VALIDITY"]]);
        const passportValidity = d ? ymd(d) : null;

        const key = `${fullName.toLowerCase()}|${(passport||"").toLowerCase()}`;
        if (!replaceExisting && existsKey.has(key)){
          skipped++;
          continue;
        }

        const p = addPersonnel({
          project_id: projectId,
          full_name: fullName,
          position: position,
          dawinci: dawinci,
          passport_no: passport,
          passport_validity: passportValidity,
          status: "active"
        });

        // also create passport credential for expiry dashboard
        if (passportValidity){
          addCredential({
            project_id: projectId,
            personnel_id: p.id,
            kind: "passport",
            issue_date: null,
            expiry_date: passportValidity,
            notes: "Imported from Master File"
          });
        }

        added++;
      }

      return { added, skipped };
    }

    // ===== Router =====
    const navigate = (hash) => { location.hash = hash; };
    function parseRoute(){
      const hash = location.hash || "#/dashboard";
      const parts = hash.replace(/^#\//,"").split("/");
      const [page, a, b, c] = parts;
      return { page, a, b, c, hash };
    }
    window.addEventListener("hashchange", route);

    // ===== UI helpers =====
    function renderNav(itemsHtml){
      return `
        <div class="nav">
          ${itemsHtml}
          <span class="badge">Mode: Demo (V3 UI + Master Import)</span>
          <button id="btnReset" class="btn secondary">Reset data</button>
        </div>
      `;
    }

    function route(){
      ensureSeed();
      const r = parseRoute();
      if (r.page === "dashboard") return renderDashboard();
      if (r.page === "p" && r.a){
        const projectId = r.a;
        if (!r.b) return renderProjectHome(projectId);
        if (r.b === "personnel"){
          if (!r.c) return renderPersonnelList(projectId);
          return renderPersonnelDetail(projectId, r.c);
        }
        if (r.b === "expiries") return renderExpiries(projectId);
      }
      navigate("#/dashboard");
    }

    function bindReset(){
      const btn = document.getElementById("btnReset");
      if (btn) btn.addEventListener("click", resetAll);
    }

    // ===== Pages =====
    function renderDashboard(){
      const projects = getProjects();
      app.innerHTML = `
        ${renderNav(`<a href="#/dashboard">Dashboard</a>`)}
        <div class="card">
          <h2>Dự án</h2>
          <p class="muted">Vào dự án → Import từ sheet <code>Master File</code> để add nhân sự + passport validity.</p>

          <div class="table-wrap" style="margin-top:10px">
            <table class="table" style="min-width:720px">
              <thead><tr><th>Code</th><th>Tên dự án</th><th></th></tr></thead>
              <tbody>
                ${projects.map(p => `
                  <tr>
                    <td>${esc(p.code||"—")}</td>
                    <td>${esc(p.name)}</td>
                    <td><a class="badge" href="#/p/${p.id}">Open</a></td>
                  </tr>
                `).join("") || `<tr><td colspan="3" class="muted">Chưa có dự án</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>

        <div class="spacer"></div>

        <div class="card">
          <h3>Tạo dự án mới</h3>
          <div class="row">
            <div style="flex:1 1 180px">
              <div class="label">Code</div>
              <input id="code" class="input" placeholder="RUYA1" />
            </div>
            <div style="flex:2 1 280px">
              <div class="label">Tên dự án *</div>
              <input id="name" class="input" placeholder="RUYA1 - Rotation Tracking" />
            </div>
          </div>
          <div class="row" style="margin-top:12px">
            <button id="btnCreate" class="btn">Create</button>
          </div>
        </div>
      `;
      bindReset();

      document.getElementById("btnCreate").addEventListener("click", () => {
        const code = document.getElementById("code").value;
        const name = document.getElementById("name").value;
        if (!name.trim()) return alert("Tên dự án là bắt buộc");
        addProject({code, name});
        renderDashboard();
      });
    }

    function renderProjectHome(projectId){
      app.innerHTML = `
        ${renderNav(`<a href="#/dashboard">← Dashboard</a> <span class="badge">Project: ${esc(projectId)}</span>`)}
        <div class="grid">
          <div class="card">
            <h3>Nhân sự</h3>
            <p class="muted">Danh sách nhân sự theo dự án + Import Master File.</p>
            <button id="goPersonnel" class="btn">Open</button>
          </div>
          <div class="card">
            <h3>Expiry Dashboard</h3>
            <p class="muted">Passport/visa/qe_pass… sắp hết hạn (mặc định 180 ngày).</p>
            <button id="goExpiry" class="btn">Open</button>
          </div>
        </div>
      `;
      bindReset();
      document.getElementById("goPersonnel").addEventListener("click", ()=>navigate(`#/p/${projectId}/personnel`));
      document.getElementById("goExpiry").addEventListener("click", ()=>navigate(`#/p/${projectId}/expiries`));
    }

    function renderPersonnelList(projectId){
      let rows = getPersonnel(projectId);
      const today = new Date();
      const until6m = addMonths(today, 6);

      function warnBadge(validityStr){
        if (!validityStr) return `<span class="badge">No date</span>`;
        const d = parseAnyDate(validityStr);
        if (!d) return `<span class="badge">No date</span>`;
        if (isExpired(d)) return `<span class="badge danger">Expired</span>`;
        if (d <= until6m) return `<span class="badge warn">Expiring ≤6M</span>`;
        return `<span class="badge">OK</span>`;
      }

      app.innerHTML = `
        ${renderNav(`<a href="#/p/${projectId}">← Project</a> <span class="badge">Personnel</span>`)}

        <div class="card">
          <h2>Import (Master File)</h2>
          <p class="muted">Chỉ đọc sheet <code>Master File</code> và lấy 5 cột: <b>FULL NAME</b>, <b>Chức danh đi biển Dự án (TA) theo KHC</b>, <b>DAWINCI</b>, <b>PASSPORT</b>, <b>PASSPORT VALIDITY</b>. Tự tạo credential loại <code>passport</code> để lên Expiry Dashboard.</p>
          <div class="row" style="margin-top:10px">
            <div style="flex: 1 1 360px">
              <div class="label">Chọn file Excel (.xlsx)</div>
              <input id="file" class="input" type="file" accept=".xlsx,.xls" />
            </div>
            <div style="flex: 0 0 220px">
              <div class="label">Replace existing (project)</div>
              <select id="replace" class="input">
                <option value="yes">Yes (đè dữ liệu project này)</option>
                <option value="no" selected>No (skip trùng tên+passport)</option>
              </select>
            </div>
            <div style="flex: 0 0 auto">
              <button id="btnImport" class="btn" disabled>Import</button>
            </div>
          </div>
          <p id="importResult" class="muted small" style="margin-top:10px"></p>
        </div>

        <div class="spacer"></div>

        <div class="card">
          <h2>Nhân sự</h2>
          <div class="row" style="margin-top:8px">
            <input id="q" class="input" style="flex:1 1 260px" placeholder="Search name/passport/position/dawinci..." />
          </div>

          <div class="table-wrap" style="margin-top:10px">
            <table class="table">
              <thead>
                <tr>
                  <th>FULL NAME</th>
                  <th>PASSPORT</th>
                  <th>PASSPORT VALIDITY</th>
                  <th>Cảnh báo (≤6M)</th>
                  <th>Chức danh (TA) theo KHC</th>
                  <th>DAWINCI</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </div>

        <div class="spacer"></div>

        <div class="card">
          <h3>Thêm nhân sự (manual)</h3>
          <div class="row">
            <div style="flex:1 1 260px">
              <div class="label">Họ tên *</div>
              <input id="full_name" class="input" />
            </div>
            <div style="flex:1 1 220px">
              <div class="label">Passport</div>
              <input id="passport_no" class="input" />
            </div>
            <div style="flex:1 1 220px">
              <div class="label">Passport Validity</div>
              <input id="passport_validity" type="date" class="input" />
            </div>
            <div style="flex:1 1 260px">
              <div class="label">Chức danh (TA) theo KHC</div>
              <input id="position" class="input" />
            </div>
            <div style="flex:1 1 220px">
              <div class="label">DAWINCI</div>
              <input id="dawinci" class="input" />
            </div>
          </div>
          <div style="margin-top:12px">
            <button id="btnAdd" class="btn">Add</button>
          </div>
        </div>
      `;
      bindReset();

      const tbody = document.getElementById("tbody");

      const renderTable = (list) => {
        tbody.innerHTML = list.map(r => {
          const d = r.passport_validity ? parseAnyDate(r.passport_validity) : null;
          const dl = d ? daysLeft(d) : null;
          const daysTxt = (dl === null) ? "" : ` <span class="muted small">(D-${dl})</span>`;
          return `
            <tr>
              <td><a class="badge" href="#/p/${projectId}/personnel/${r.id}">${esc(r.full_name)}</a></td>
              <td>${esc(r.passport_no||"—")}</td>
              <td>${esc(r.passport_validity||"—")}${daysTxt}</td>
              <td>${warnBadge(r.passport_validity)}</td>
              <td>${esc(r.position||"—")}</td>
              <td>${esc(r.dawinci||"—")}</td>
              <td>${esc(r.status||"—")}</td>
            </tr>
          `;
        }).join("") || `<tr><td colspan="7" class="muted">No data</td></tr>`;
      };

      renderTable(rows);

      // Search
      document.getElementById("q").addEventListener("input", (e) => {
        const q = (e.target.value||"").toLowerCase().trim();
        if (!q) return renderTable(rows);
        const filtered = rows.filter(r =>
          (r.full_name||"").toLowerCase().includes(q) ||
          (r.passport_no||"").toLowerCase().includes(q) ||
          (r.position||"").toLowerCase().includes(q) ||
          (r.dawinci||"").toLowerCase().includes(q)
        );
        renderTable(filtered);
      });

      // Manual add
      document.getElementById("btnAdd").addEventListener("click", () => {
        const full_name = document.getElementById("full_name").value;
        if (!full_name.trim()) return alert("Họ tên là bắt buộc");
        const passport_no = document.getElementById("passport_no").value.trim() || null;
        const passport_validity = document.getElementById("passport_validity").value || null;
        const position = document.getElementById("position").value.trim() || null;
        const dawinci = document.getElementById("dawinci").value.trim() || null;

        const p = addPersonnel({ project_id: projectId, full_name: full_name.trim(), passport_no, passport_validity, position, dawinci, status:"active" });
        if (passport_validity){
          addCredential({ project_id: projectId, personnel_id: p.id, kind:"passport", issue_date:null, expiry_date: passport_validity, notes:"Manual add" });
        }
        rows = getPersonnel(projectId);
        renderTable(rows);

        document.getElementById("full_name").value = "";
        document.getElementById("passport_no").value = "";
        document.getElementById("passport_validity").value = "";
        document.getElementById("position").value = "";
        document.getElementById("dawinci").value = "";
      });

      // Import
      const fileEl = document.getElementById("file");
      const btnImport = document.getElementById("btnImport");
      const replaceEl = document.getElementById("replace");
      const resultEl = document.getElementById("importResult");

      fileEl.addEventListener("change", () => {
        btnImport.disabled = !(fileEl.files && fileEl.files.length);
        resultEl.textContent = "";
      });

      btnImport.addEventListener("click", async () => {
        const f = fileEl.files && fileEl.files[0];
        if (!f) return;
        btnImport.disabled = true;
        btnImport.textContent = "Importing...";
        resultEl.textContent = "";

        try{
          const replace = replaceEl.value === "yes";
          const res = await importFromMasterFileToProject(projectId, f, replace);
          rows = getPersonnel(projectId);
          renderTable(rows);
          resultEl.textContent = `Done: added ${res.added}, skipped ${res.skipped}.`;
        } catch (e){
          alert(String(e && e.message ? e.message : e));
        } finally {
          btnImport.textContent = "Import";
          btnImport.disabled = false;
        }
      });
    }

    function renderPersonnelDetail(projectId, personnelId){
      const p = getPersonnelById(projectId, personnelId);
      const creds = getCredentials(projectId, personnelId);

      const d = p?.passport_validity ? parseAnyDate(p.passport_validity) : null;
      const today = new Date();
      const until6m = addMonths(today, 6);

      let passBadge = `<span class="badge">No date</span>`;
      if (d){
        if (isExpired(d)) passBadge = `<span class="badge danger">Expired</span>`;
        else if (d <= until6m) passBadge = `<span class="badge warn">Expiring ≤6M</span>`;
        else passBadge = `<span class="badge">OK</span>`;
      }

      const dl = d ? daysLeft(d) : null;
      const daysTxt = (dl === null) ? "" : ` <span class="muted small">(D-${dl})</span>`;

      app.innerHTML = `
        ${renderNav(`<a href="#/p/${projectId}/personnel">← Personnel</a> <span class="badge">Detail</span>`)}
        <div class="card">
          <h2>${esc(p?.full_name || "—")}</h2>
          <div class="row" style="margin-top:6px">
            <span class="badge">Passport: ${esc(p?.passport_no || "—")}</span>
            <span class="badge">Validity: ${esc(p?.passport_validity || "—")}${daysTxt}</span>
            ${passBadge}
            <span class="badge">DAWINCI: ${esc(p?.dawinci || "—")}</span>
            <span class="badge">Position: ${esc(p?.position || "—")}</span>
            <span class="badge">Status: ${esc(p?.status || "—")}</span>
          </div>
        </div>

        <div class="spacer"></div>

        <div class="card">
          <h3>Giấy tờ / Expiry</h3>
          <div class="table-wrap" style="margin-top:10px">
            <table class="table" style="min-width:760px">
              <thead><tr><th>Loại</th><th>Issue</th><th>Expiry</th><th>Ghi chú</th></tr></thead>
              <tbody>
                ${creds.map(c => `
                  <tr>
                    <td>${esc(c.kind)}</td>
                    <td>${esc(c.issue_date || "—")}</td>
                    <td>${esc(c.expiry_date || "—")}</td>
                    <td>${esc(c.notes || "—")}</td>
                  </tr>
                `).join("") || `<tr><td colspan="4" class="muted">No credentials</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>

        <div class="spacer"></div>

        <div class="card">
          <h3>Thêm giấy tờ</h3>
          <div class="row">
            <div style="flex:1 1 220px">
              <div class="label">Loại *</div>
              <select id="kind" class="input">
                <option value="passport">passport</option>
                <option value="visa">visa</option>
                <option value="qe_pass">qe_pass</option>
                <option value="medical">medical</option>
                <option value="certificate">certificate</option>
              </select>
            </div>
            <div style="flex:1 1 220px">
              <div class="label">Issue date</div>
              <input id="issue_date" type="date" class="input" />
            </div>
            <div style="flex:1 1 220px">
              <div class="label">Expiry date *</div>
              <input id="expiry_date" type="date" class="input" />
            </div>
          </div>
          <div class="label">Notes</div>
          <input id="notes" class="input" placeholder="e.g. QE Pass for NOC yard" />
          <div style="margin-top:12px">
            <button id="btnAddCred" class="btn">Add</button>
          </div>
        </div>
      `;
      bindReset();

      document.getElementById("btnAddCred").addEventListener("click", () => {
        const kind = document.getElementById("kind").value;
        const issue_date = document.getElementById("issue_date").value || null;
        const expiry_date = document.getElementById("expiry_date").value;
        const notes = document.getElementById("notes").value || null;
        if (!expiry_date) return alert("Expiry date là bắt buộc");

        addCredential({ project_id: projectId, personnel_id: personnelId, kind, issue_date, expiry_date, notes });

        // If adding passport kind, sync to personnel.passport_validity
        if (kind === "passport"){
          const all = getPersonnelAll();
          const updated = all.map(x => {
            if (x.id === personnelId) return { ...x, passport_validity: expiry_date };
            return x;
          });
          setPersonnelAll(updated);
        }

        navigate(`#/p/${projectId}/personnel/${personnelId}`);
      });
    }

    function renderExpiries(projectId){
      const defaultDays = 180; // ~6 months
      const kinds = ["all", "passport", "visa", "qe_pass", "medical", "certificate"];

      app.innerHTML = `
        ${renderNav(`<a href="#/p/${projectId}">← Project</a> <span class="badge">Expiry</span>`)}
        <div class="card">
          <h2>Giấy tờ sắp hết hạn</h2>
          <div class="row" style="margin-top:8px; align-items:center">
            <div style="flex:0 0 auto">
              <span class="badge">Window (days)</span>
            </div>
            <div style="width:140px">
              <input id="days" class="input" type="number" min="1" max="3650" value="${defaultDays}" />
            </div>
            <div style="width:200px">
              <select id="kindFilter" class="input">
                ${kinds.map(k => `<option value="${k}" ${k==="all"?"selected":""}>${k}</option>`).join("")}
              </select>
            </div>
            <button id="btnRefresh" class="btn secondary">Refresh</button>
          </div>

          <div class="table-wrap" style="margin-top:10px">
            <table class="table" style="min-width:900px">
              <thead><tr><th>Nhân sự</th><th>Passport</th><th>DAWINCI</th><th>Loại</th><th>Expiry</th><th>D-</th></tr></thead>
              <tbody id="tbody2"></tbody>
            </table>
          </div>
          <p class="muted small" style="margin-top:10px">Mặc định window = 180 ngày (~6 tháng). Passport validity import từ Master File sẽ nằm ở kind <code>passport</code>.</p>
        </div>
      `;
      bindReset();

      const tbody = document.getElementById("tbody2");

      function renderTable(){
        const d = Number(document.getElementById("days").value || defaultDays);
        const kindFilter = document.getElementById("kindFilter").value || "all";
        const rows = getExpiries(projectId, d, kindFilter);

        tbody.innerHTML = rows.map(r => {
          const dl = r.expiry_date ? daysLeft(parseAnyDate(r.expiry_date)) : null;
          const cls = (dl !== null && dl <= 30) ? "badge danger" : (dl !== null && dl <= 90) ? "badge warn" : "badge";
          return `
            <tr>
              <td>${esc(r.full_name)}</td>
              <td>${esc(r.passport_no||"—")}</td>
              <td>${esc(r.dawinci||"—")}</td>
              <td>${esc(r.kind||"—")}</td>
              <td>${esc(r.expiry_date||"—")}</td>
              <td>${dl === null ? "—" : `<span class="${cls}">${dl}</span>`}</td>
            </tr>
          `;
        }).join("") || `<tr><td colspan="6" class="muted">No expiries in window</td></tr>`;
      }

      document.getElementById("btnRefresh").addEventListener("click", renderTable);
      document.getElementById("kindFilter").addEventListener("change", renderTable);

      renderTable();
    }

    // start
    ensureSeed();
    route();

  })();
  </script>
</body>
</html>
