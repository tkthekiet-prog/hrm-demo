<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HRM Demo - QE PASS Dashboard</title>
  <style>
    :root {
      --bg:#fafafa; --card:#fff; --text:#111; --muted:#6b7280;
      --border:#e5e7eb; --shadow:0 10px 25px rgba(0,0,0,.06);
      --radius:16px;
      --danger:#b91c1c; --warn:#b45309; --ok:#166534; --info:#1d4ed8;
      --chip:#f3f4f6;
      --chipOn:#111827; --chipOnText:#fff;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:var(--bg); color:var(--text);
    }
    header {
      position:sticky; top:0; z-index:10;
      background:rgba(250,250,250,.85); backdrop-filter: blur(10px);
      border-bottom:1px solid var(--border);
    }
    .wrap { max-width:1180px; margin:0 auto; padding:14px 16px; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .spacer { flex:1; }
    h1 { margin:0; font-size:18px; letter-spacing:.2px; }
    .badge {
      font-size:12px; padding:6px 10px; border-radius:999px; background:var(--chip);
      border:1px solid var(--border); color:#111;
    }
    .btn {
      appearance:none; border:1px solid var(--border); background:var(--card);
      padding:9px 12px; border-radius:12px; cursor:pointer; box-shadow:0 1px 0 rgba(0,0,0,.02);
      font-weight:600;
    }
    .btn.primary { background:#111; color:#fff; border-color:#111; }
    .btn.ghost { background:transparent; }
    .btn.small { padding:7px 10px; font-weight:600; font-size:12px; border-radius:10px; }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .card {
      background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:14px;
    }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; }
    .tab {
      padding:8px 10px; border-radius:12px; border:1px solid var(--border); background:var(--card);
      cursor:pointer; font-weight:700; font-size:13px;
    }
    .tab.active { background:#111; color:#fff; border-color:#111; }
    .muted { color:var(--muted); font-size:13px; }
    .kpis { display:grid; grid-template-columns: repeat(6, 1fr); gap:10px; }
    @media (max-width: 980px) { .kpis { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    .kpi { border:1px solid var(--border); border-radius:14px; padding:10px; background:var(--card); }
    .kpi .v { font-size:18px; font-weight:800; }
    .kpi .l { font-size:12px; color:var(--muted); margin-top:2px; }
    .filters {
      display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;
      padding:12px; border:1px dashed var(--border); border-radius:14px; background:#fcfcfc;
    }
    label { font-size:12px; color:var(--muted); display:block; margin-bottom:4px; }
    input, select {
      padding:9px 10px; border:1px solid var(--border); border-radius:12px; background:#fff;
      min-width: 140px;
    }
    input[type="search"] { min-width: 260px; }
    .chips { display:flex; gap:8px; flex-wrap:wrap; }
    .chip {
      border:1px solid var(--border); background:var(--chip); padding:7px 10px; border-radius:999px;
      font-size:12px; font-weight:800; cursor:pointer;
    }
    .chip.on { background:var(--chipOn); color:var(--chipOnText); border-color:var(--chipOn); }
    table { width:100%; border-collapse:collapse; }
    thead th {
      text-align:left; font-size:12px; color:var(--muted); font-weight:800;
      padding:10px 8px; border-bottom:1px solid var(--border);
      position:sticky; top:64px; background:rgba(255,255,255,.95); backdrop-filter: blur(8px);
      z-index: 5;
    }
    tbody td {
      padding:8px; border-bottom:1px solid var(--border); vertical-align:top;
      font-size:13px;
    }
    tbody tr:hover { background:#fbfbfb; }
    .mono { font-family:var(--mono); font-size:12px; }
    .pill {
      display:inline-block; padding:4px 8px; border-radius:999px; font-size:12px; font-weight:800;
      border:1px solid var(--border); background:var(--chip);
    }
    .pill.danger { background:#fee2e2; border-color:#fecaca; color:var(--danger); }
    .pill.warn { background:#ffedd5; border-color:#fed7aa; color:var(--warn); }
    .pill.ok { background:#dcfce7; border-color:#bbf7d0; color:var(--ok); }
    .pill.info { background:#dbeafe; border-color:#bfdbfe; color:var(--info); }
    .cell-input { width: 100%; min-width: 100px; padding:7px 8px; border-radius:10px; }
    .cell-select { width:100%; min-width: 92px; padding:7px 8px; border-radius:10px; }
    .right { text-align:right; }
    .hint { font-size:12px; color:var(--muted); margin-top:8px; line-height:1.35; }
    .footer { padding:20px 0 40px; }
    .tiny { font-size:11px; color:var(--muted); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

const STORAGE_KEY = "hrm_v8_store";
function todayISO() {
  const d = new Date();
  const z = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return z.toISOString().slice(0,10);
}
function parseISO(s) {
  if(!s) return null;
  const d = new Date(s + "T00:00:00");
  return isNaN(d.getTime()) ? null : d;
}
function daysLeft(iso) {
  const d = parseISO(iso);
  if(!d) return null;
  const t = parseISO(todayISO());
  const diff = Math.floor((d - t) / (24*3600*1000));
  return diff;
}
function warnPill(iso) {
  const dl = daysLeft(iso);
  if(dl === null) return {label:"No date", cls:"info"};
  if(dl < 0) return {label:`EXPIRED ${Math.abs(dl)}d`, cls:"danger"};
  if(dl <= 30) return {label:`≤30d (${dl})`, cls:"danger"};
  if(dl <= 90) return {label:`≤90d (${dl})`, cls:"warn"};
  if(dl <= 180) return {label:`≤180d (${dl})`, cls:"warn"};
  return {label:`OK (${dl})`, cls:"ok"};
}
function normalizeNone(v) {
  if(v === null || v === undefined) return null;
  if(typeof v === "string") {
    const t = v.trim();
    if(!t) return null;
    if(t.toUpperCase() === "NONE") return null;
    return t;
  }
  return v;
}
function uid(prefix="id") {
  return prefix + "_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
}

function loadStore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  } catch(e) {
    return null;
  }
}
function saveStore(store) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
}
function ensureSeed() {
  let store = loadStore();
  if(!store || !store.projects || store.projects.length === 0) {
    store = {
      projects: SEED.projects,
      personnel: SEED.personnel,
      passes: SEED.passes,
    };
    saveStore(store);
  }
  return store;
}

function setHash(path) { location.hash = path; }
function getHash() { return (location.hash || "#/").replace(/^#/, ""); }
function byId(list, id) { return list.find(x => x.id === id) || null; }

function upsertPersonnelByPassport(store, projectId, passportNo, fullName) {
  const pp = (passportNo || "").trim().toUpperCase();
  const name = (fullName || "").trim();
  let p = store.personnel.find(x => x.project_id === projectId && x.passport_no && x.passport_no.toUpperCase() === pp);
  if(!p) {
    p = {
      id: "pers_" + (pp || uid("pp")).replace(/[^A-Z0-9]/g,"_"),
      project_id: projectId,
      full_name: name || "(No name)",
      passport_no: pp || null,
      dawinci: null,
      position: null,
      status: "active"
    };
    store.personnel.push(p);
  } else {
    if(name && (!p.full_name || p.full_name.length < name.length)) p.full_name = name;
  }
  return p.id;
}

function linkPassesToPersonnel(store) {
  for(const rec of store.passes) {
    if(rec.personnel_id) continue;
    const pid = upsertPersonnelByPassport(store, rec.project_id, rec.passport_no, rec.full_name);
    rec.personnel_id = pid;
  }
}

function calcLatestExpiryForPersonnel(store, pid) {
  const items = store.passes.filter(x => x.personnel_id === pid);
  const latest = { qe: null, rl: null, any: null };
  for(const r of items) {
    const t = (r.main_type || "").toUpperCase();
    if((t === "QE" || t === "RL") && r.main_valid_date) {
      const iso = r.main_valid_date;
      if(t === "QE" && (!latest.qe || iso > latest.qe)) latest.qe = iso;
      if(t === "RL" && (!latest.rl || iso > latest.rl)) latest.rl = iso;
      if(!latest.any || iso > latest.any) latest.any = iso;
    }
    const st = (r.sub_type || "").toUpperCase();
    if((st === "QE" || st === "RL") && r.sub_valid_date) {
      const iso = r.sub_valid_date;
      if(st === "QE" && (!latest.qe || iso > latest.qe)) latest.qe = iso;
      if(st === "RL" && (!latest.rl || iso > latest.rl)) latest.rl = iso;
      if(!latest.any || iso > latest.any) latest.any = iso;
    }
  }
  return latest;
}

function render() {
  const store = ensureSeed();
  linkPassesToPersonnel(store);
  saveStore(store);

  const app = document.getElementById("app");
  const hash = getHash();

  if(hash === "/") {
    app.innerHTML = "";
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="row">
        <div>
          <div style="font-weight:900;font-size:20px;margin-bottom:4px;">Projects</div>
          <div class="muted">Chọn dự án để xem nhân sự và QE/RL PASS.</div>
        </div>
      </div>
      <div style="height:10px"></div>
      <div id="projList"></div>
    `;
    app.appendChild(card);
    const list = card.querySelector("#projList");
    for(const p of store.projects) {
      const item = document.createElement("div");
      item.className = "card";
      item.style.marginTop = "10px";
      const countPers = store.personnel.filter(x => x.project_id === p.id).length;
      const countPass = store.passes.filter(x => x.project_id === p.id).length;
      item.innerHTML = `
        <div class="row">
          <div style="font-weight:900">${p.code} — ${p.name}</div>
          <span class="spacer"></span>
          <span class="badge">${countPers} nhân sự</span>
          <span class="badge">${countPass} dòng PASS</span>
          <button class="btn primary">Open</button>
        </div>
      `;
      item.querySelector("button").onclick = () => setHash(`/p/${p.id}/passes`);
      list.appendChild(item);
    }
    return;
  }

  const m = hash.match(/^\/p\/([^\/]+)(?:\/(personnel|passes))?$/);
  if(!m) { setHash("/"); return; }
  const pid = m[1];
  const section = m[2] || "passes";
  const project = byId(store.projects, pid);
  if(!project) { setHash("/"); return; }

  app.innerHTML = "";
  const header = document.createElement("div");
  header.className = "card";
  header.innerHTML = `
    <div class="row">
      <div>
        <div style="font-weight:950;font-size:20px">${project.code} — ${project.name}</div>
        <div class="muted">PASS lấy từ 2 agent (GAC/GWC). Có thể chỉnh trực tiếp trên bảng và lọc nhanh bằng “tác vụ”.</div>

      <span class="spacer"></span>
      <div class="tabs">
        <div class="tab ${section==="passes" ? "active":""}" data-tab="passes">QE/RL PASS Dashboard</div>
        <div class="tab ${section==="personnel" ? "active":""}" data-tab="personnel">Personnel</div>
      </div>
    </div>
  `;
  header.querySelectorAll(".tab").forEach(t => {
    t.onclick = () => setHash(`/p/${pid}/${t.dataset.tab}`);
  });
  app.appendChild(header);

  const body = document.createElement("div");
  body.style.marginTop = "12px";
  app.appendChild(body);

  if(section === "personnel") renderPersonnel(body, store, project);
  else renderPasses(body, store, project);
}

function renderPersonnel(root, store, project) {
  const persons = store.personnel.filter(x => x.project_id === project.id);
  const passByPid = new Map();
  for(const r of store.passes.filter(x => x.project_id === project.id)) {
    const arr = passByPid.get(r.personnel_id) || [];
    arr.push(r);
    passByPid.set(r.personnel_id, arr);
  }

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="row">
      <div style="font-weight:900;font-size:16px;">Personnel</div>
      <span class="spacer"></span>
      <input id="q" type="search" placeholder="Search name / passport..." />

            <th>Latest QE expiry</th>
            <th>Latest RL expiry</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  `;
  root.appendChild(card);

  const q = card.querySelector("#q");
  const tbody = card.querySelector("#tbody");

  function draw() {
    const needle = (q.value || "").trim().toLowerCase();
    tbody.innerHTML = "";
    const list = persons.filter(p => {
      if(!needle) return true;
      return (p.full_name || "").toLowerCase().includes(needle) || (p.passport_no || "").toLowerCase().includes(needle);
    });
    for(const p of list) {
      const rows = passByPid.get(p.id) || [];
      const latest = calcLatestExpiryForPersonnel(store, p.id);
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${p.full_name || ""}</td>
        <td class="mono">${p.passport_no || ""}</td>
        <td class="right">${rows.length}</td>
        <td>${latest.qe ? `<span class="pill ${warnPill(latest.qe).cls}">${latest.qe}</span>` : `<span class="pill info">—</span>`}</td>
        <td>${latest.rl ? `<span class="pill ${warnPill(latest.rl).cls}">${latest.rl}</span>` : `<span class="pill info">—</span>`}</td>
        <td class="right"><button class="btn small">View passes</button></td>
      `;
      tr.querySelector("button").onclick = () => {
        setHash(`/p/${project.id}/passes`);
        setTimeout(() => {
          const inp = document.querySelector("#passSearch");
          if(inp) {
            inp.value = p.passport_no || p.full_name || "";
            inp.dispatchEvent(new Event("input"));
          }
        }, 30);
      };
      tbody.appendChild(tr);
    }
  }
  q.oninput = draw;
  draw();
}

    <div class="card" style="box-shadow:none;">
      <div style="font-weight:900;">Import PASS (Sheet: PASS)</div>
      <div class="muted">Bạn có thể import lại file GAC/GWC bất kỳ lúc nào. Trùng dòng sẽ được thêm mới (không xoá dòng cũ).</div>
      <div style="height:10px"></div>
      <div class="row">
        <div>
          <label>Agent</label>
          <select id="impAgent">
            <option value="GAC">GAC</option>
            <option value="GWC">GWC</option>
          </select>
        </div>
        <div>
          <label>Excel file</label>
          <input id="impFile" type="file" accept=".xlsx" />
        </div>
        <button class="btn primary" id="btnImport">Import</button>
      </div>
      <div class="hint">Cột chuẩn (theo file bạn gửi): No., Submitted, Batch, PP No., FULL NAME, Main pass, Issued date, Expired date, Supp pass, Issued date2, Expired date2, STATUS, Must obtain by, Remark</div>
    </div>
  `;
  root.appendChild(card);

  const kpisEl = card.querySelector("#kpis");
  const tbody = card.querySelector("#tbodyPass");
  const meta = card.querySelector("#resultMeta");
  const passSearch = card.querySelector("#passSearch");
  const fAgent = card.querySelector("#fAgent");
  const fStt = card.querySelector("#fStt");
  const fBatch = card.querySelector("#fBatch");
  const fMain = card.querySelector("#fMain");
  const fStatus = card.querySelector("#fStatus");
  const fSort = card.querySelector("#fSort");
  const btnClear = card.querySelector("#btnClear");

  let page = 1;
  const pageSizeSel = card.querySelector("#pageSize");
  const prevPage = card.querySelector("#prevPage");
  const nextPage = card.querySelector("#nextPage");
  const pageInfo = card.querySelector("#pageInfo");

  const quick = { key: null };

  const statusSet = new Set();
  for(const r of all) { if(r.status) statusSet.add(String(r.status)); }
  Array.from(statusSet).sort().forEach(s => {
    const op = document.createElement("option");
    op.value = s; op.textContent = s;
    fStatus.appendChild(op);
  });

  function buildChips() {
    const chips = [
      {key:"all", label:"All"},
      {key:"expired", label:"Expired"},
      {key:"d30", label:"≤30d"},
      {key:"d90", label:"≤90d"},
      {key:"d180", label:"≤180d"},
      {key:"nodate", label:"No expiry"},
      {key:"missing_batch", label:"Missing batch"},
      {key:"missing_submit", label:"Missing submit"},
      {key:"missing_issue", label:"Missing issue"},
      {key:"has_sub", label:"Has sub pass"},
      {key:"main_qe", label:"Main QE"},
      {key:"main_rl", label:"Main RL"},
    ];
    const wrap = card.querySelector("#quickChips");
    wrap.innerHTML = "";
    for(const c of chips) {
      const el = document.createElement("div");
      const on = (c.key === "all" ? !quick.key : quick.key === c.key);
      el.className = "chip" + (on ? " on" : "");
      el.textContent = c.label;
      el.onclick = () => {
        if(c.key === "all") quick.key = null;
        else quick.key = (quick.key === c.key) ? null : c.key;
        page = 1;
        draw();
      };
      wrap.appendChild(el);
    }
  }

  function computeKPIs(list) {
    const k = { total:list.length, expired:0, d30:0, d90:0, d180:0, nodate:0, gac:0, gwc:0 };
    for(const r of list) {
      if(r.agent === "GAC") k.gac++;
      if(r.agent === "GWC") k.gwc++;
      const iso = r.main_valid_date || r.sub_valid_date || null;
      const dl = daysLeft(iso);
      if(dl === null) k.nodate++;
      else if(dl < 0) k.expired++;
      else if(dl <= 30) k.d30++;
      else if(dl <= 90) k.d90++;
      else if(dl <= 180) k.d180++;
    }
    return k;
  }
  function renderKPIs(list) {
    const k = computeKPIs(list);
    kpisEl.innerHTML = "";
    const items = [
      {v:k.total, l:"Total PASS rows"},
      {v:k.gac, l:"Agent GAC"},
      {v:k.gwc, l:"Agent GWC"},
      {v:k.expired, l:"Expired"},
      {v:k.d30, l:"≤30 days"},
      {v:k.d180, l:"≤180 days"},
    ];
    for(const it of items) {
      const el = document.createElement("div");
      el.className = "kpi";
      el.innerHTML = `<div class="v">${it.v}</div><div class="l">${it.l}</div>`;
      kpisEl.appendChild(el);
    }
  }

  function applyFilters(list) {
    const needle = (passSearch.value || "").trim().toLowerCase();
    const a = (fAgent.value || "").trim();
    const stt = (fStt.value || "").trim();
    const batch = (fBatch.value || "").trim();
    const main = (fMain.value || "").trim().toUpperCase();
    const status = (fStatus.value || "").trim();

    return list.filter(r => {
      if(a && r.agent !== a) return false;

      if(needle) {
        const n1 = (r.full_name || "").toLowerCase();
        const n2 = (r.passport_no || "").toLowerCase();
        if(!n1.includes(needle) && !n2.includes(needle)) return false;
      }
      if(stt && String(r.stt || "").trim() !== stt) return false;
      if(batch && String(r.batch || "").trim() !== batch) return false;
      if(main && String(r.main_type || "").toUpperCase() !== main) return false;
      if(status && String(r.status || "") !== status) return false;

      const q = quick.key;
      if(q) {
        const dl = daysLeft(r.main_valid_date);
        if(q === "expired") { if(dl === null || dl >= 0) return false; }
        else if(q === "d30") { if(dl === null || dl < 0 || dl > 30) return false; }
        else if(q === "d90") { if(dl === null || dl < 0 || dl > 90) return false; }
        else if(q === "d180") { if(dl === null || dl < 0 || dl > 180) return false; }
        else if(q === "nodate") { if(dl !== null) return false; }
        else if(q === "missing_batch") { if(r.batch && String(r.batch).trim()) return false; }
        else if(q === "missing_submit") { if(r.submit_date) return false; }
        else if(q === "missing_issue") { if(r.main_issue_date) return false; }
        else if(q === "has_sub") { if(!r.sub_type) return false; }
        else if(q === "main_qe") { if(String(r.main_type || "").toUpperCase() !== "QE") return false; }
        else if(q === "main_rl") { if(String(r.main_type || "").toUpperCase() !== "RL") return false; }
      }
      return true;
    });
  }

  function sortList(list) {
    const s = fSort.value;
    const copy = list.slice();
    if(s === "expiry_asc") copy.sort((a,b) => (a.main_valid_date||"9999") < (b.main_valid_date||"9999") ? -1 : (a.main_valid_date||"9999") > (b.main_valid_date||"9999") ? 1 : 0);
    else if(s === "expiry_desc") copy.sort((a,b) => (a.main_valid_date||"") > (b.main_valid_date||"") ? -1 : (a.main_valid_date||"") < (b.main_valid_date||"") ? 1 : 0);
    else if(s === "submit_desc") copy.sort((a,b) => (a.submit_date||"") > (b.submit_date||"") ? -1 : (a.submit_date||"") < (b.submit_date||"") ? 1 : 0);
    else if(s === "batch_desc") copy.sort((a,b) => (Number(a.batch)||0) < (Number(b.batch)||0) ? 1 : (Number(a.batch)||0) > (Number(b.batch)||0) ? -1 : 0);
    else if(s === "name_asc") copy.sort((a,b) => (a.full_name||"").localeCompare(b.full_name||""));
    return copy;
  }

  function paginate(list) {
    const size = Number(pageSizeSel.value || 100);
    const totalPages = Math.max(1, Math.ceil(list.length / size));
    if(page > totalPages) page = totalPages;
    const start = (page - 1) * size;
    return { page, totalPages, slice: list.slice(start, start + size) };
  }

  function updateRec(id, patch) {
    const rec = store.passes.find(x => x.id === id);
    if(!rec) return;
    Object.assign(rec, patch);
    if("passport_no" in patch || "full_name" in patch) {
      rec.personnel_id = upsertPersonnelByPassport(store, rec.project_id, rec.passport_no, rec.full_name);
    }
    saveStore(store);
  }

  function cellDateInput(value, onChange) {
    const inp = document.createElement("input");
    inp.type = "date";
    inp.className = "cell-input";
    inp.value = value || "";
    inp.onchange = () => onChange(inp.value || null);
    return inp;
  }

  function draw() {
    buildChips();
    const filtered = applyFilters(all);
    renderKPIs(filtered);

    const sorted = sortList(filtered);
    const pg = paginate(sorted);

    meta.textContent = `Results: ${filtered.length} row(s)`;
    pageInfo.textContent = `${pg.page} / ${pg.totalPages}`;

    prevPage.disabled = (pg.page <= 1);
    nextPage.disabled = (pg.page >= pg.totalPages);

    tbody.innerHTML = "";
    for(const r of pg.slice) {
      const tr = document.createElement("tr");
      const warnMain = warnPill(r.main_valid_date);
      const warnSub = r.sub_valid_date ? warnPill(r.sub_valid_date) : null;
      const warnText = `Main: ${warnMain.label}` + (warnSub ? ` • Sub: ${warnSub.label}` : "");

      const tdStt = document.createElement("td");
      const sttInp = document.createElement("input");
      sttInp.className = "cell-input mono"; sttInp.value = r.stt || "";
      sttInp.onchange = () => updateRec(r.id, {stt: sttInp.value || null});
      tdStt.appendChild(sttInp);

      const tdBatch = document.createElement("td");
      const batchInp = document.createElement("input");
      batchInp.className = "cell-input mono"; batchInp.value = r.batch || "";
      batchInp.onchange = () => updateRec(r.id, {batch: batchInp.value || null});
      tdBatch.appendChild(batchInp);

      const tdOldBatch = document.createElement("td");
      const oldBatchInp = document.createElement("input");
      oldBatchInp.className = "cell-input mono"; oldBatchInp.value = r.batch_old || "";
      oldBatchInp.onchange = () => updateRec(r.id, {batch_old: oldBatchInp.value || null});
      tdOldBatch.appendChild(oldBatchInp);

      const tdOldExp = document.createElement("td");
      tdOldExp.appendChild(cellDateInput(r.batch_old_valid, v => updateRec(r.id, {batch_old_valid: v})));

      const tdSubmit = document.createElement("td");
      tdSubmit.appendChild(cellDateInput(r.submit_date, v => updateRec(r.id, {submit_date: v})));

      const tdPP = document.createElement("td");
      const ppInp = document.createElement("input");
      ppInp.className = "cell-input mono"; ppInp.value = r.passport_no || "";
      ppInp.onchange = () => updateRec(r.id, {passport_no: (ppInp.value || "").trim().toUpperCase() || null});
      tdPP.appendChild(ppInp);

      const tdName = document.createElement("td");
      const nameInp = document.createElement("input");
      nameInp.className = "cell-input"; nameInp.value = r.full_name || "";
      nameInp.onchange = () => updateRec(r.id, {full_name: nameInp.value || null});
      tdName.appendChild(nameInp);

      const tdMain = document.createElement("td");
      const mainSel = document.createElement("select");
      mainSel.className = "cell-select";
      ["", "QE", "RL"].forEach(opt => {
        const o = document.createElement("option");
        o.value = opt; o.textContent = opt || "—";
        if((r.main_type || "") === opt) o.selected = true;
        mainSel.appendChild(o);
      });
      mainSel.onchange = () => updateRec(r.id, {main_type: mainSel.value || null});
      tdMain.appendChild(mainSel);

      const tdIssue = document.createElement("td");
      tdIssue.appendChild(cellDateInput(r.main_issue_date, v => updateRec(r.id, {main_issue_date: v})));

      const tdValid = document.createElement("td");
      tdValid.appendChild(cellDateInput(r.main_valid_date, v => updateRec(r.id, {main_valid_date: v})));

      const tdSub = document.createElement("td");
      const subSel = document.createElement("select");
      subSel.className = "cell-select";
      ["", "QE", "RL"].forEach(opt => {
        const o = document.createElement("option");
        o.value = opt; o.textContent = opt || "—";
        if((r.sub_type || "") === opt) o.selected = true;
        subSel.appendChild(o);
      });
      subSel.onchange = () => updateRec(r.id, {sub_type: subSel.value || null});
      tdSub.appendChild(subSel);

      const tdIssue2 = document.createElement("td");
      tdIssue2.appendChild(cellDateInput(r.sub_issue_date, v => updateRec(r.id, {sub_issue_date: v})));

      const tdValid2 = document.createElement("td");
      tdValid2.appendChild(cellDateInput(r.sub_valid_date, v => updateRec(r.id, {sub_valid_date: v})));

      const tdAgent = document.createElement("td");
      const agentSel = document.createElement("select");
      agentSel.className = "cell-select";
      ["GAC","GWC"].forEach(opt => {
        const o = document.createElement("option");
        o.value = opt; o.textContent = opt;
        if(r.agent === opt) o.selected = true;
        agentSel.appendChild(o);
      });
      agentSel.onchange = () => updateRec(r.id, {agent: agentSel.value});
      tdAgent.appendChild(agentSel);

      const tdStatus = document.createElement("td");
      const statusInp = document.createElement("input");
      statusInp.className = "cell-input"; statusInp.value = r.status || "";
      statusInp.onchange = () => {
        updateRec(r.id, {status: statusInp.value || null});
        if(statusInp.value && !Array.from(fStatus.options).some(o=>o.value===statusInp.value)) {
          const op = document.createElement("option");
          op.value = statusInp.value; op.textContent = statusInp.value;
          fStatus.appendChild(op);
        }
      };
      tdStatus.appendChild(statusInp);

      const tdRemark = document.createElement("td");
      const remarkInp = document.createElement("input");
      remarkInp.className = "cell-input"; remarkInp.value = r.remark || "";
      remarkInp.onchange = () => updateRec(r.id, {remark: remarkInp.value || null});
      tdRemark.appendChild(remarkInp);

      const tdWarn = document.createElement("td");
      const pill = document.createElement("span");
      pill.className = "pill " + warnMain.cls;
      pill.textContent = warnText;
      tdWarn.appendChild(pill);

      tr.appendChild(tdStt);
      tr.appendChild(tdBatch);
      tr.appendChild(tdOldBatch);
      tr.appendChild(tdOldExp);
      tr.appendChild(tdSubmit);
      tr.appendChild(tdPP);
      tr.appendChild(tdName);
      tr.appendChild(tdMain);
      tr.appendChild(tdIssue);
      tr.appendChild(tdValid);
      tr.appendChild(tdSub);
      tr.appendChild(tdIssue2);
      tr.appendChild(tdValid2);
      tr.appendChild(tdAgent);
      tr.appendChild(tdStatus);
      tr.appendChild(tdRemark);
      tr.appendChild(tdWarn);

      tbody.appendChild(tr);
    }
  }

  function clearFilters() {
    passSearch.value = "";
    fAgent.value = "";
    fStt.value = "";
    fBatch.value = "";
    fMain.value = "";
    fStatus.value = "";
    fSort.value = "expiry_asc";
    quick.key = null;
    page = 1;
    draw();
  }

  passSearch.oninput = () => { page = 1; draw(); };
  fAgent.onchange = () => { page = 1; draw(); };
  fStt.oninput = () => { page = 1; draw(); };
  fBatch.oninput = () => { page = 1; draw(); };
  fMain.onchange = () => { page = 1; draw(); };
  fStatus.onchange = () => { page = 1; draw(); };
  fSort.onchange = () => { page = 1; draw(); };
  btnClear.onclick = clearFilters;

  pageSizeSel.onchange = () => { page = 1; draw(); };
  prevPage.onclick = () => { if(page>1) page--; draw(); };
  nextPage.onclick = () => { page++; draw(); };

  const impAgent = card.querySelector("#impAgent");
  const impFile = card.querySelector("#impFile");
  const btnImport = card.querySelector("#btnImport");

  function findHeaderRow(rows) {
    for(let i=0;i<Math.min(rows.length,10);i++) {
      const r = rows[i] || [];
      const c0 = String(r[0] || "").trim().toLowerCase();
      if(c0 === "no." || c0 === "no" || c0 === "stt") return i;
    }
    return 1;
  }
  function toISODate(val) {
    if(!val) return null;
    if(typeof val === "string") {
      const t = val.trim();
      if(!t || t.toUpperCase() === "NONE") return null;
      const m = t.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
      if(m) {
        let dd = Number(m[1]), mm = Number(m[2]), yy = Number(m[3]);
        if(yy < 100) yy += 2000;
        const d = new Date(Date.UTC(yy, mm-1, dd));
        return d.toISOString().slice(0,10);
      }
      const d = new Date(t);
      if(!isNaN(d.getTime())) {
        const z = new Date(d.getTime() - d.getTimezoneOffset()*60000);
        return z.toISOString().slice(0,10);
      }
      return null;
    }
    if(val instanceof Date) {
      const z = new Date(val.getTime() - val.getTimezoneOffset()*60000);
      return z.toISOString().slice(0,10);
    }
    if(typeof val === "number" && window.XLSX && XLSX.SSF) {
      const d = XLSX.SSF.parse_date_code(val);
      if(d) {
        const js = new Date(Date.UTC(d.y, d.m-1, d.d));
        return js.toISOString().slice(0,10);
      }
    }
    return null;
  }

  btnImport.onclick = async () => {
    const file = impFile.files && impFile.files[0];
    if(!file) { alert("Chọn file .xlsx trước đã."); return; }
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:"array"});
      const ws = wb.Sheets["PASS"];
      if(!ws) { alert("Không thấy sheet tên PASS."); return; }
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
      const h = findHeaderRow(rows);
      const headers = (rows[h] || []).map(x => String(x||"").trim());
      const idx = (name) => headers.findIndex(x => x.toLowerCase() === name.toLowerCase());
      const col = {
        no: idx("No."), submitted: idx("Submitted"), batch: idx("Batch"), pp: idx("PP No."), full: idx("FULL NAME"),
        main: idx("Main pass"), issue: idx("Issued date"), exp: idx("Expired date"),
        supp: idx("Supp pass"), issue2: idx("Issued date2"), exp2: idx("Expired date2"),
        status: idx("STATUS"), must: idx("Must obtain by"), remark: idx("Remark"),
      };
      const agent = impAgent.value;
      let added = 0;

      for(let r=h+1; r<rows.length; r++) {
        const row = rows[r];
        if(!row) continue;
        const pp = String(row[col.pp] ?? "").trim();
        const full = String(row[col.full] ?? "").trim();
        if(!pp && !full) continue;

        const pid = upsertPersonnelByPassport(store, project.id, pp, full);
        const rec = {
          id: uid("pass"),
          project_id: project.id,
          personnel_id: pid,
          passport_no: pp ? pp.toUpperCase() : null,
          full_name: full || null,
          stt: String(row[col.no] ?? "").trim() || null,
          batch: String(row[col.batch] ?? "").trim() || null,
          submit_date: toISODate(row[col.submitted]),
          batch_old: null,
          batch_old_valid: null,
          main_type: normalizeNone(row[col.main]),
          main_pass_no: null,
          main_issue_date: toISODate(row[col.issue]),
          main_valid_date: toISODate(row[col.exp]),
          sub_type: normalizeNone(row[col.supp]),
          sub_pass_no: null,
          sub_issue_date: toISODate(row[col.issue2]),
          sub_valid_date: toISODate(row[col.exp2]),
          agent,
          status: normalizeNone(row[col.status]),
          must_obtain_by: toISODate(row[col.must]),
          remark: normalizeNone(row[col.remark]),
          notes: null,
        };
        store.passes.push(rec);
        added++;
      }

      saveStore(store);
      alert(`Import xong: +${added} dòng PASS (Agent ${agent}).`);
      location.reload();
    } catch(e) {
      console.error(e);
      alert("Import lỗi. Bạn mở Console để xem chi tiết.");
    }
  };

  draw();
}

document.getElementById("btnReset").onclick = () => {
  localStorage.removeItem(STORAGE_KEY);
  location.hash = "#/";
  location.reload();
};

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
